name: Deploy GitHub Pages
on:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site bundle
        run: |
          mkdir -p _site
          cp -R index.html sw.js manifest.json icon.svg icon-180.png icon-512.png .nojekyll css js content audio generated_roles_fast _site/
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Wait for artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || exit 1
          for attempt in {1..6}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.id == $ARTIFACT_ID and .expired == false) | .id" \
              | grep -qx "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 30
          done
          printf '%s\n' '::error::Uploaded Pages artifact did not become visible within three minutes.'
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
