// =====================================================
// 死亡处理
// =====================================================

function tryNineLives(player) {
    const holder = findActiveCardHolder('NINE_LIVES', player.id);
    if (!holder || player.nineLivesUsed) return false;
    // 尝试次数属于受保护的目标；成功和失败都会消耗，不能通过叠卡重抽。
    player.nineLivesUsed = true;
    holder.cardUsed = true;
    const survived = randomChance(0.5);
    log(`🐱 ${player.name} 的九命猫${survived ? '生效，免死！' : '未能免死'}`, survived ? 'good' : 'info');
    return survived;
}

function applyNightDeathProtection(causes, pid) {
    const player = getPlayerById(pid);
    if (player.immuneTonight) {
        delete causes[pid];
        log(`🛡️ ${player.name} 挡住了当晚的刀和毒`, 'good');
        return;
    }
    // 每个新刀口（含替身转移）都重新检查保护；守护和解药不能挡毒。
    if (gameState.guardianTarget === pid || Object.values(gameState.witchSaveTargets).includes(pid)) {
        removeCause(causes, pid, 'knife');
    }
}

function processNightDeaths() {
    if (beginMindReadDelivery()) return;
    const causes = {};

    // 狼人杀人
    addCause(causes, gameState.nightKillTarget, 'knife');
    // 石像鬼杀人
    addCause(causes, gameState.gargoyleKillTarget, 'knife');
    // 女巫毒杀
    Object.values(gameState.witchPoisonTargets).forEach(id => addCause(causes, id, 'poison'));

    const actualDeaths = [];
    const queue = Object.keys(causes).map(Number);
    while (queue.length > 0) {
        const pid = queue.shift();
        if (!causes[pid]) continue;
        const player = getPlayerById(pid);
        if (!player || !player.alive) continue;
        applyNightDeathProtection(causes, pid);
        if (!causes[pid]) continue;

        const killedByKnife = hasCause(causes, pid, 'knife');
        const killedByPoison = hasCause(causes, pid, 'poison');

        // 检查替身傀儡（仅对夜间杀人有效，被毒时无效）
        const decoyHolder = findActiveCardHolder('DECOY', pid);
        if (decoyHolder && killedByKnife && !killedByPoison) {
            const others = getAlivePlayers().filter(p => p.id !== pid);
            if (others.length > 0) {
                const decoyTarget = randomItem(others);
                decoyHolder.cardUsed = true;
                delete causes[pid];
                log(`🎎 ${player.name} 的替身傀儡生效，死亡转移到 ${decoyTarget.name}`, 'good');
                addCause(causes, decoyTarget.id, 'knife');
                queue.push(decoyTarget.id);
                continue;
            }
        }

        if (tryNineLives(player)) {
            delete causes[pid];
            continue;
        }

        // 确认死亡
        player.alive = false;
        actualDeaths.push(pid);
        log(`💀 ${player.name} 死亡（${causeText(causes, pid)}）`, 'info');
    }

    gameState.deathsTonight = new Set(actualDeaths);
    gameState.deathCauses = {};
    Object.keys(causes).forEach(pid => {
        gameState.deathCauses[pid] = causeText(causes, pid);
    });

    expireNightOnlyCards();
    gameState.hunterQueue = [];
    gameState.hunterQueueMode = 'night';
    showNightToDayTransition();
}

function nightHunterCanShoot(player) {
    if (!player || player.alive || player.roleKey !== 'hunter' || !player.canShoot) return false;
    const cause = gameState.deathCauses ? gameState.deathCauses[player.id] : '';
    return Boolean(cause) && !String(cause).includes('poison');
}

function beginNightHunterConfirmations() {
    clearNightTransitionTimer();
    gameState.hunterQueueMode = 'night';
    gameState.hunterQueue = Array.from(gameState.deathsTonight || [])
        .map(id => getPlayerById(Number(id)))
        .filter(nightHunterCanShoot);
    advanceNightHunterQueue();
}

function advanceNightHunterQueue() {
    while (gameState.hunterQueue.length > 0) {
        const next = gameState.hunterQueue.shift();
        const hunterId = typeof next === 'number' ? next : next.id;
        const hunter = getPlayerById(hunterId);
        if (!nightHunterCanShoot(hunter)) continue;
        if (!getAlivePlayers().some(player => player.id !== hunterId)) continue;
        showNightHunterHandoff(hunterId);
        return;
    }
    startDayPhase();
}

function expireNightOnlyCards() {
    gameState.players.forEach(holder => {
        if (!isCardActive(holder)) return;
        if (['MIST', 'FRAME_UP', 'MIND_READ'].includes(holder.card.id)) {
            holder.cardUsed = true;
        }
    });
}

function daySpeechTimerHtml(seconds = DAY_SPEECH_SECONDS) {
    return `
        <div class="night-phase-timer">
            <div class="label">30 秒计时</div>
            <div class="count"><span id="day-speech-countdown">${seconds}</span>s</div>
            <div class="note">倒计时结束后自动进入下一位，也可以直接跳过。</div>
        </div>
    `;
}

function startDaySpeakingTimer(nextAction, seconds = DAY_SPEECH_SECONDS) {
    clearDaySpeechTimer();
    gameState.dayTimerNextAction = nextAction;
    let remaining = restoredTimerSeconds('daySpeechRemaining', seconds);
    gameState.daySpeechRemaining = remaining;

    function render() {
        const countdown = document.getElementById('day-speech-countdown');
        if (countdown) countdown.textContent = remaining;
    }

    render();
    daySpeechTimerId = setInterval(() => {
        remaining = Math.max(0, remaining - 1);
        gameState.daySpeechRemaining = remaining;
        render();
        if (remaining > 0) saveGameSnapshot();
        if (remaining <= 0) {
            finishDaySpeakingTimer();
        }
    }, 1000);
}

function finishDaySpeakingTimer() {
    clearDaySpeechTimer();
    const action = gameState.dayTimerNextAction;
    gameState.dayTimerNextAction = null;

    if (action === 'dayLastWords') {
        advanceDayLastWords();
        return;
    }

    if (action === 'daySpeech') {
        advanceDaySpeech();
    }
}

function startDaySpeechFlow() {
    // 昨夜死亡或平安夜公告已经显示后，才允许进入胜负揭晓。
    if (checkVictory()) return;
    clearDaySpeechTimer();
    gameState.phase = PHASE.DAY;
    gameState.dayLastWordsQueue = Array.from(gameState.deathsTonight)
        .map(id => getPlayerById(id))
        .filter(Boolean)
        .map(p => p.id);
    gameState.dayLastWordsIndex = 0;
    gameState.daySpeechQueue = getAlivePlayers().map(p => p.id);
    gameState.daySpeechIndex = 0;

    if (gameState.dayLastWordsQueue.length > 0) {
        showNextDayLastWords();
        return;
    }
    showNextDaySpeech();
}

function showNextDayLastWords() {
    const id = gameState.dayLastWordsQueue[gameState.dayLastWordsIndex];

function skipDayLastWords() {

function advanceDayLastWords() {
    gameState.dayLastWordsIndex += 1;
    if (gameState.dayLastWordsIndex >= gameState.dayLastWordsQueue.length) {
        showNextDaySpeech();

    }
    showNextDayLastWords();

function showNextDaySpeech() {
    while (gameState.daySpeechIndex < gameState.daySpeechQueue.length) {
        const player = getPlayerById(gameState.daySpeechQueue[gameState.daySpeechIndex]);
        if (player && player.alive) break;
        gameState.daySpeechIndex += 1;

    if (gameState.daySpeechIndex >= gameState.daySpeechQueue.length) {

    const player = getPlayerById(gameState.daySpeechQueue[gameState.daySpeechIndex]);

function applyDayCards() {
    const effects = new Map();
    gameState.players.forEach(holder => {
        if (!isCardActive(holder)) return;
        const card = holder.card;
        const target = getPlayerById(holder.cardTargetId);
        if (!target || !target.alive) return;
        if (card.id === 'SILENCE_SEAL') {
            target.silencedToday = true;
            holder.cardUsed = true;
            log(`🤐 沉默之印生效：${target.name} 今天不能投票`, 'wolf');
        } else if (['HALF_VOTE', 'DOUBLE_VOTE', 'CRITICAL_HIT', 'JUDGMENT'].includes(card.id)) {
            const effect = effects.get(target.id) || { half: false, setPower: null, multiplier: 1 };
            if (card.id === 'HALF_VOTE') effect.half = true;
            if (card.id === 'DOUBLE_VOTE') effect.setPower = Math.max(effect.setPower || 0, 2);
            if (card.id === 'JUDGMENT') effect.setPower = Math.max(effect.setPower || 0, 3);
            if (card.id === 'CRITICAL_HIT') effect.multiplier *= 3;
            effects.set(target.id, effect);
            holder.cardUsed = true;
        }
    });
    effects.forEach((effect, id) => {
        const target = getPlayerById(id);
        const base = effect.half ? 0.5 : (effect.setPower ?? target.votePower);
        target.votePower = Math.round(base * effect.multiplier * 100) / 100;
        log(`🗳️ 票权卡生效：${target.name} 今天投票权为${target.votePower}`, 'info');
    });
}

function showNextVoter() {
    const alive = getAlivePlayers();
    if (gameState.voterIndex >= alive.length) {
        // 所有玩家投票完成
        tallyVotes();
        return;
    }

    const voter = alive[gameState.voterIndex];

    // 检查沉默
    if (voter.silencedToday) {
        log(`🤐 ${voter.name} 被沉默，跳过投票`, 'info');
        gameState.voterIndex++;
        showNextVoter();
        return;
    }

    document.getElementById('game-phase-text').textContent = `第${gameState.dayNumber}天 · 投票`;

    const targets = gameState.revoteCandidates
        ? alive.filter(p => gameState.revoteCandidates.includes(p.id))
        : alive;
    const cards = targets.map(p => `
        <div class="vote-candidate ${gameState.selectedTarget === p.id ? 'selected' : ''}" id="vote-${p.id}" onclick="selectVoteTarget(${voter.id}, ${p.id})">
            <div class="player-avatar" style="font-size:28px;">${p.gender === 'female' ? '👩' : '👨'}</div>
            <div>
                <div style="font-size:15px;font-weight:600;">${p.name}</div>
                <div style="font-size:12px;color:var(--text-dim);">${text('vote.choiceHint')}</div>
            </div>
        </div>
    `).join('');

    document.getElementById('game-content').innerHTML = `
        <div style="text-align:center;margin-bottom:16px;">
            <span class="phase-badge day">${text('vote.phase')}</span>
        </div>
        <div class="info-box" style="text-align:center;">
            <div class="handoff-prompt">${text('vote.handoff')}<span class="name">${voter.name}</span></div>
        </div>
        <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:12px;"
            >${text('vote.target')}</div>
        ${cards}
    `;

    document.getElementById('game-bottom-bar').innerHTML = `
        <button class="btn btn-primary btn-block" onclick="confirmVote(${voter.id})"
            >${text('vote.confirm', { name: voter.name })}</button>
    `;
    setGameResumeView('vote');
}

function selectVoteTarget(voterId, targetId) {
    gameState.selectedTarget = targetId;
    document.querySelectorAll('.vote-candidate').forEach(c => c.classList.remove('selected'));
    document.getElementById(`vote-${targetId}`).classList.add('selected');
    saveGameSnapshot();
}

function confirmVote(voterId) {
    if (gameState.selectedTarget === null) {
        alert('请先选择投票目标');
        return;
    }

    const voter = getPlayerById(voterId);
    const targetId = gameState.selectedTarget;

    // 计算票数（含搅局者加成）
    let votes = voter.votePower;
    if (isCardActive(voter, 'DISRUPTOR') || voter.disruptorVoteDay === gameState.dayNumber) {
        votes += 2.0;
        voter.disruptorVoteDay = gameState.dayNumber;
        voter.cardUsed = true;
        log(`🌀 ${voter.name} 的搅局者生效，${getPlayerById(targetId).name} 额外+2票（不公开）`, 'wolf');
    }

    // 使用百分之一票的整数累计，避免 1.6 等小数的累加误差破坏平票。
    gameState.voteMap[targetId] = (Math.round((gameState.voteMap[targetId] || 0) * 100) + Math.round(votes * 100)) / 100;
    log(`🗳️ ${voter.name} 投票给 ${getPlayerById(targetId).name}`, 'info');

    gameState.selectedTarget = null;
    gameState.voterIndex++;
    showNextVoter();
}

function tallyVotes() {
    const votes = gameState.voteMap;
    const entries = Object.entries(votes);

    if (entries.length === 0) {
        log(`无人投票，跳过投票出局`, 'info');
        advanceToNextNight();
        return;
    }

    const maxVotes = Math.max(...entries.map(([_, v]) => Math.round(v * 100)));
    const candidates = entries.filter(([_, v]) => Math.round(v * 100) === maxVotes).map(([id, _]) => parseInt(id));

    // 房规：平票重投（只重投一轮，重投再平票则随机）
    if (candidates.length > 1 && tieVoteRevote && !gameState.revoteCandidates) {
        gameState.revoteCandidates = candidates;
        gameState.voteMap = {};
        gameState.voterIndex = 0;
        gameState.selectedTarget = null;
        const names = candidates.map(id => getPlayerById(id).name).join('、');
        log(`⚖️ 平票（${names}），进入重投`, 'info');
        renderRevoteIntro();
        return;
    }

    // 平票随机（默认房规；或重投后仍平票）
    if (candidates.length > 1) {
        log(`⚖️ 平票（${candidates.map(id => getPlayerById(id).name).join('、')}），随机处决其中一人`, 'info');
    }
    gameState.revoteCandidates = null;
    const votedOutId = randomItem(candidates);
    const votedOut = getPlayerById(votedOutId);

    speakGodLine('voteResult');
    if (!tryNineLives(votedOut)) {
        votedOut.alive = false;
        log(`📢 ${votedOut.name} 被投票出局`, 'info');
        const punishment = getRandomExilePunishment();
        gameState.pendingExilePunishment = punishment;
        gameState.pendingExilePunishmentPlayerId = punishment ? votedOutId : null;
    } else {
        gameState.pendingExilePunishment = '';
        gameState.pendingExilePunishmentPlayerId = null;
    }

    renderVoteResult(votedOutId);
}

function renderVoteResult(votedOutId, cause = 'vote') {
    const votedOut = getPlayerById(votedOutId);
    const shot = cause === 'hunter';
    document.getElementById('game-phase-text').textContent = `第${gameState.dayNumber}天 · ${shot ? text('hunter.result.phase') : '投票'}`;
    // 这里只展示已经确定的结果，恢复不会重新计票或重新抽签。
    if (votedOut.alive) {
        clearLastWordsTimer();
        document.getElementById('game-content').innerHTML = `
            <div style="text-align:center;padding:20px 0;">
                <span class="phase-badge day">${text(shot ? 'hunter.result.phase' : 'vote.survived.phase')}</span>
                <div class="dawn-card" style="margin-top:16px;">
                    <div style="font-size:44px;margin-bottom:10px;">🛡️</div>
                    <div style="font-size:22px;font-weight:800;">${votedOut.name}</div>
                    <div style="font-size:13px;color:var(--text-secondary);margin-top:6px;">${text(shot ? 'hunter.result.survived' : 'vote.survived.text')}</div>

        `;
        document.getElementById('game-bottom-bar').innerHTML = `
            <button class="btn btn-primary btn-block" onclick="afterVote()">${text('vote.survived.continue')}</button>
        `;
        setGameResumeView('voteResult', votedOutId, cause);
        return;
    }
    if (!shot && gameState.pendingExilePunishment && gameState.pendingExilePunishmentPlayerId === votedOut.id) {
        showExilePunishment(votedOut.id);
        return;
    }
    document.getElementById('game-content').innerHTML = `
        <div style="text-align:center;padding:20px 0;">
            <span class="phase-badge day">${shot ? text('hunter.result.phase') : text('vote.survived.phase')}</span>
            <div class="dawn-card killed" style="margin-top:16px;">
                <div style="font-size:44px;margin-bottom:10px;">⚖️</div>
                <div style="font-size:22px;font-weight:800;color:var(--accent-red);">${votedOut.name}</div>
                <div style="font-size:13px;color:var(--text-secondary);margin-top:6px;">${shot ? text('hunter.result.dead') : '被投票出局'}</div>
            </div>
            <div class="info-box" style="margin-top:16px;">
                <div>💬 ${votedOut.name} 发表遗言</div>
                <div class="last-words-timer"><span id="last-words-countdown">30</span>s</div>
                <div id="last-words-hint">可等待遗言倒计时，也可以直接继续。</div>
                <div>🔒 身份不公开</div>
            </div>
        </div>
    `;

    // 所有死者使用相同公开入口，不能通过按钮暴露未发动的猎人身份。
    document.getElementById('game-bottom-bar').innerHTML = `
        <button class="btn btn-primary btn-block" data-last-words-wait onclick="showEliminationHandoff(${votedOut.id})">${text('hunter.handoff.continue')}</button>
    `;
    startLastWordsTimer(30);
    setGameResumeView('voteResult', votedOutId, cause);
}

// 胜利判定
// =====================================================

function checkVictory() {
    const alive = getAlivePlayers();
    const goodAlive = alive.filter(p => p.alignment === ALIGNMENT.GOOD).length;
    const wolfAlive = alive.filter(p => p.alignment === ALIGNMENT.WOLF).length;

    // 狼人全灭（普通狼人+石像鬼都死）
    const totalWolves = gameState.players.filter(p => p.alignment === ALIGNMENT.WOLF).length;
    const allWolvesDead = gameState.players.filter(p =>
        p.alignment === ALIGNMENT.WOLF && !p.alive
    ).length === totalWolves;

    if (allWolvesDead) {
        gameState.winner = ALIGNMENT.GOOD;
        showResult();
        return true;
    }

    if (goodAlive === 0) {
        gameState.winner = ALIGNMENT.WOLF;
        showResult();
        return true;
    }

    return false;
}

function isConservativeWolfLockedWin(alive) {
    const goodPlayers = alive.filter(p => p.alignment === ALIGNMENT.GOOD);
    const wolfPlayers = alive.filter(p => p.alignment === ALIGNMENT.WOLF);

    if (goodPlayers.length === 0 || wolfPlayers.length === 0) return false;

    const maxPossibleWolfDeaths = getMaxPossibleGoodWolfDeaths(goodPlayers, wolfPlayers);
    return maxPossibleWolfDeaths < wolfPlayers.length;
}

function getMaxPossibleGoodWolfDeaths(goodPlayers, wolfPlayers) {
    // 这是给好人“尽量多算”的上界，不是精确模拟。
    // 只要上界仍清不完狼人，才可以保守判定狼人锁胜。
    const currentVoteDeaths = gameState.phase === PHASE.DAY ? 1 : 0;
    const survivalCredits = getGoodSurvivalCredits(goodPlayers, wolfPlayers);
    const futureVoteDeaths = Math.max(0, goodPlayers.length - 1 + survivalCredits);
    const directWolfDeaths = getGoodDirectWolfDeathCredits(goodPlayers);

    return currentVoteDeaths + futureVoteDeaths + directWolfDeaths;
}

function getGoodSurvivalCredits(goodPlayers, wolfPlayers) {
    const cfg = getConfig(gameState.playerCount);
    let credits = 0;

    goodPlayers.forEach(player => {
        if (player.roleKey === 'witch') {
            const otherGoodAlive = goodPlayers.filter(other => other.id !== player.id).length;
            credits += Math.min(Math.max(0, player.maxCure - player.cureUsed), otherGoodAlive);
            if (cfg.witchCanSelfSave && !player.selfSaveUsed) credits += 1;
        }

        if (player.roleKey === 'guardian') {
            if (goodPlayers.length === 1) {
                credits += player.guardedId === player.id ? 0 : 1;
            } else {
                // 多好人残局仍给守卫足够宽松的上界，避免误判。
                credits += wolfPlayers.length;
            }
        }

        if (player.roleKey === 'prophet') {
            credits += Math.max(0, cfg.prophetImmuneNights - gameState.dayNumber);
        }

        if (player.immuneTonight) credits += 1;
    });

    gameState.players.forEach(holder => {
        if (!isCardActive(holder)) return;
        const target = getPlayerById(holder.cardTargetId);
        if (!target || !target.alive || target.alignment !== ALIGNMENT.GOOD) return;

        if (holder.card.id === 'IMMUNITY') credits += 1;
        if (holder.card.id === 'NINE_LIVES' && !target.nineLivesUsed) credits += 1;
        if (holder.card.id === 'DECOY') credits += 1;
    });

    return credits;
}

function getGoodDirectWolfDeathCredits(goodPlayers) {
    let credits = 0;

    goodPlayers.forEach(player => {
        if (player.roleKey === 'witch') {
            credits += Math.max(0, player.maxPoison - player.poisonUsed);
        }

        if (player.roleKey === 'hunter' && player.canShoot) {
            credits += 1;
        }
    });

    gameState.players.forEach(holder => {
        if (!isCardActive(holder) || holder.card.id !== 'DECOY') return;
        const target = getPlayerById(holder.cardTargetId);
        if (target && target.alive && target.alignment === ALIGNMENT.GOOD) {
            credits += 1;
        }
    });

    return credits;
}

function getVictoryPrivileges() {
    return getNumberedGameTextValues('victory.privilege');

    const privileges = getVictoryPrivileges();
    return drawNonRepeatingPersistentItem(privileges, 'werewolf-used-victory-privileges');
}

function drawVictoryPrivilege() {
    if (!gameState.victoryPrivilege) {
        gameState.victoryPrivilege = getRandomVictoryPrivilege();
    }
    showResult();
}

function replaceVictoryPrivilege() {
    const current = gameState.victoryPrivilege;
    if (!current) return;
    const pool = getVictoryPrivileges().filter(item => item !== current);
    gameState.victoryPrivilege = pool.length
        ? drawNonRepeatingPersistentItem(pool, 'werewolf-used-victory-privileges')
        : '';
    showResult();
}

function renderResultActions() {
    const bottomBar = document.getElementById('screen-result-bottom');
    if (!bottomBar) return;

    bottomBar.innerHTML = `

        <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="resetGame()">⚙️ 返回设置</button>
    `;
}

    gameState.phase = PHASE.END;

    releaseWakeLock();

    const winnerClass = isGoodWin ? 'good' : 'wolf';

                ${Object.values(PRIVILEGE_CARDS).filter(c => c.type === 'good_break').map(c => `
                    <div class="mini-card">
                        <div class="emoji">${c.emoji}</div>
                        <div class="name">${c.name}</div>
                        <div class="desc">${c.desc}</div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
    showModal(content);
}

function switchRuleTab(btn, tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.rules-section').forEach(s => s.style.display = 'none');
    document.getElementById('rule-' + tab).style.display = 'block';
}

function confirmQuit() {
    if (confirm('确定要退出当前游戏吗？')) {
        resetGame();
    }
}

// =====================================================
// 初始化
// =====================================================

async function initApp() {
    await loadGameText();
    renderNameInputs();
    updateGodVoiceToggle();
    updateHouseRuleToggles();
    renderResumeBanner();
}

initApp();

// 切回前台时重新申请 Wake Lock（切后台系统会自动释放）
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveGameSnapshot();
    if (document.visibilityState === 'visible'
        && gameState && gameState.players && gameState.players.length > 0
        && gameState.phase !== PHASE.SETUP && gameState.phase !== PHASE.END) {
        acquireWakeLock();
    }
});

let pendingServiceWorker = null;
let pwaUpdateRequested = false;
let refreshing = false;
let pwaStatusTimer = null;
let pwaUpdateTimer = null;
let pwaStatusRequestId = 0;

function isSafeForPWAUpdate() {
    const activeScreen = document.querySelector('.screen.active');
    return activeScreen && ['screen-home', 'screen-result'].includes(activeScreen.id);
}

function showPWAStatus(message, showUpdateButton = false) {
    const status = document.getElementById('pwa-status');
    const statusText = document.getElementById('pwa-status-text');
    const button = document.getElementById('pwa-update-btn');
    if (!status || !statusText || !button) return;

    if (pwaStatusTimer) {
        window.clearTimeout(pwaStatusTimer);
        pwaStatusTimer = null;
    }
    const activeScreen = document.querySelector('.screen.active');
    const canShowStatus = activeScreen && ['screen-home', 'screen-setup', 'screen-result'].includes(activeScreen.id);
    if (!canShowStatus) {
        button.style.display = 'none';
        status.classList.remove('active');
        return;
    }

    statusText.innerHTML = message;
    button.style.display = showUpdateButton && isSafeForPWAUpdate() ? 'block' : 'none';
    button.disabled = pwaUpdateRequested;
    status.classList.add('active');
    if (!showUpdateButton) {
        pwaStatusTimer = window.setTimeout(() => {
            status.classList.remove('active');
            pwaStatusTimer = null;
        }, 2500);
    }
}

function requestOfflineStatus(worker) {
    if (!worker || typeof MessageChannel === 'undefined') return Promise.resolve(null);
    return new Promise(resolve => {
        const channel = new MessageChannel();
        let settled = false;
        let timeout = null;
        function finish(value) {
            if (settled) return;
            settled = true;
            if (timeout) window.clearTimeout(timeout);
            channel.port1.close();
            resolve(value);
        }
        channel.port1.onmessage = event => {
            if (event.data && event.data.type === 'OFFLINE_STATUS') finish(event.data);
        };
        timeout = window.setTimeout(() => finish(null), 2500);
        try {
            worker.postMessage({ type: 'GET_OFFLINE_STATUS' }, [channel.port2]);
        } catch (error) {
            finish(null);
        }
    });
}

async function updatePWAStatus() {
    const requestId = ++pwaStatusRequestId;
    if (pendingServiceWorker && ['installed', 'activating', 'activated'].includes(pendingServiceWorker.state)) {
        showPWAUpdatePrompt(pendingServiceWorker);
        return;
    }
    const controller = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (!controller) {
        showPWAStatus(text(navigator.onLine ? 'pwa.preparing' : 'pwa.unavailable'));
        return;
    }
    const status = await requestOfflineStatus(controller);
    // 页面切换、版本通知和较新的请求优先，避免旧的异步回复覆盖更新按钮。
    if (requestId !== pwaStatusRequestId || pendingServiceWorker) return;
    showPWAStatus(text(status && status.ready === true
        ? (navigator.onLine ? 'pwa.ready' : 'pwa.offline') : 'pwa.unavailable'));
}

function showPWAUpdatePrompt(worker) {
    if (!worker || !['installed', 'activating', 'activated'].includes(worker.state)) return;
    pendingServiceWorker = worker;
    pwaStatusRequestId += 1;
    if (pwaUpdateRequested) {
        showPWAStatus(text('pwa.updating'));
        return;
    }
    const canUpdate = isSafeForPWAUpdate();
    showPWAStatus(text(canUpdate ? 'pwa.updateReady' : 'pwa.updateLater'), canUpdate);
}

function applyPWAUpdate() {
    if (!isSafeForPWAUpdate() || pwaUpdateRequested || refreshing) return;
    const worker = pendingServiceWorker;
    if (!worker) return;
    // 若另一标签页已完成激活，用户仍可明确选择重新载入本页。
    if (worker.state === 'activated') {
        refreshing = true;
        window.location.reload();
        return;
    }
    if (worker.state !== 'installed') return;

    pwaUpdateRequested = true;
    showPWAStatus(text('pwa.updating'));
    pwaUpdateTimer = window.setTimeout(() => {
        pwaUpdateTimer = null;
        if (refreshing || pendingServiceWorker !== worker || worker.state === 'redundant') return;
        pwaUpdateRequested = false;
        showPWAStatus(text('pwa.updateFailed'), true);
    }, 10000);
    try {
        worker.postMessage({ type: 'SKIP_WAITING' });
    } catch (error) {
        window.clearTimeout(pwaUpdateTimer);
        pwaUpdateTimer = null;
        pwaUpdateRequested = false;
        showPWAStatus(text('pwa.updateFailed'), true);
    }
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(registration => {
            updatePWAStatus();
            const watchedWorkers = new Set();
            function watchWorker(newWorker) {
                if (!newWorker || watchedWorkers.has(newWorker)) return;
                watchedWorkers.add(newWorker);
                const onStateChange = () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        showPWAUpdatePrompt(newWorker);
                    } else if (newWorker.state === 'redundant') {
                        // 旧 worker 退役也会触发此事件，不能清除新版本的刷新请求。
                        if (pendingServiceWorker === newWorker) {
                            pendingServiceWorker = null;
                            pwaUpdateRequested = false;
                            if (pwaUpdateTimer) {
                                window.clearTimeout(pwaUpdateTimer);
                                pwaUpdateTimer = null;
                            }
                        }
                        updatePWAStatus();
                    }
                };
                newWorker.addEventListener('statechange', onStateChange);
                onStateChange();
            }
            // 注册完成时可能已有下载中或等待中的版本，不能只监听后续 updatefound。
            watchWorker(registration.waiting);
            watchWorker(registration.installing);
            registration.addEventListener('updatefound', () => watchWorker(registration.installing));
        }).catch(error => {
            console.warn('Service worker registration failed:', error);
            updatePWAStatus();
        });
    });

    navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (pwaUpdateTimer) {
            window.clearTimeout(pwaUpdateTimer);
            pwaUpdateTimer = null;
        }
        if (pwaUpdateRequested && !refreshing) {
            if (isSafeForPWAUpdate()) {
                refreshing = true;
                window.location.reload();
                return;
            }
            // 点击更新后已进入对局，也不能强制刷新；回首页/结算后再提示重载。
            pwaUpdateRequested = false;
            pendingServiceWorker = navigator.serviceWorker.controller;
        }
        updatePWAStatus();
    });
}

window.addEventListener('pagehide', () => saveGameSnapshot());
window.addEventListener('online', updatePWAStatus);
window.addEventListener('offline', updatePWAStatus);
</script>
