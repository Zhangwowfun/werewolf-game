<title>狼人杀 v4.2 · 石像鬼版</title>
<style>
:root {
    color-scheme: dark;
    --bg-primary: #0c1919;
    --bg-secondary: #102222;
    --bg-card: #162a29;
    --bg-card-hover: #213b37;
    --surface-glass: rgba(27, 46, 43, 0.82);
    --surface-strong: #203632;
    --surface-soft: rgba(230, 218, 191, 0.045);
    --accent-green: #9dc9af;
    --accent-neon: #dcc18f;
    --accent-lime: #e9d5af;
    --accent-gold: #d7b983;
    --accent-yellow: #d7b983;
    --accent-red: #e59a8b;
    --accent-blue: #a7c9d0;
    --accent-purple: #b9b1cc;
    --accent-orange: #e3b286;
    --accent-pink: #d6a7b7;
    --text-primary: #f0e8d8;
    --text-secondary: #b7c4ba;
    --text-dim: #91a69a;
    --border-color: rgba(204, 216, 188, 0.15);
    --border-strong: rgba(215, 185, 131, 0.43);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    --shadow-deep: 0 24px 64px rgba(0, 0, 0, 0.32);
    --radius: 18px;
    --radius-sm: 12px;
    --font-display: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", Georgia, serif;
    --ipad-side-width: minmax(292px, 348px);
    --transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}
#app-root {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: radial-gradient(ellipse at 8% 4%, #203f38 0, transparent 53%),
        radial-gradient(ellipse at 90% 95%, #18332f 0, transparent 50%), var(--bg-primary);
}
#app-root::before,
#app-root::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
}
#app-root::before {
    opacity: 0.07;
    background-size: 180px 180px;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.3' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
}
#app-root::after {
    inset: 12px;
    border: 1px solid rgba(215,185,131,0.09);
    border-radius: 16px;
}
.screen {
    display: none;
    flex-direction: column;
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 1;
    animation: fadeIn 0.28s ease;
}
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
.header {
    padding: max(20px, env(safe-area-inset-top)) 24px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 12px;
}
.header-title {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text-primary);
}
.header-back {
    width: 44px;
    height: 44px;
    background: var(--surface-glass);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    color: var(--text-primary);
    box-shadow: var(--shadow);
    transition: var(--transition);
}
.header-back:active { transform: scale(0.92); background: var(--bg-card-hover); }
.content { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 24px 24px; -webkit-overflow-scrolling: touch; }
.bottom-bar { padding: 16px 24px 24px; flex-shrink: 0; }
.nav-row { display: flex; gap: 12px; }
.nav-row .btn { flex: 1; }
.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 52px;
    padding: 14px 24px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: 0.04em;
    border: 1px solid transparent;
    cursor: pointer;
    transition: var(--transition);
    text-align: center;
}
.btn:active { transform: translateY(1px) scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:disabled:active { transform: none; }
.btn-primary {
    background: linear-gradient(120deg, #e4cfaa, #cfad76);
    color: #25322b;
    border-color: rgba(245,228,192,0.4);

}

    color: var(--text-secondary);

}
.btn-danger {
    background: #ae6159; color: #fff6ed; border-color: #cf857a;
}
.btn-block { width: 100%; }
.btn-lg {
    min-height: 60px; padding: 17px 30px; font-size: 18px; border-radius: 14px;
}
.btn-sm { min-height: 44px; padding: 10px 18px; font-size: 15px; border-radius: 14px; }
.card,
.config-preview,
.victory-privilege-card,
.privilege-public-card,
.role-detail-card,
.mini-card,
.reveal-card {

    box-shadow: var(--shadow);
}

.card-title {

}

    background: rgba(167,201,208,0.045);
    border: 1px solid rgba(167,201,208,0.15);
    border-left: 2px solid rgba(167,201,208,0.45);

    margin-bottom: 16px;
    font-size: 14px;

}
.info-box div { margin: 4px 0; }
.handoff-prompt { font-size: 28px; font-weight: 700; color: var(--text-primary); line-height: 1.24; }
.handoff-prompt .name { display: block; font-size: 40px; color: var(--accent-gold); margin-top: 10px; }
.privilege-public-card { padding: 20px; text-align: left; margin: 14px 0; border-color: var(--border-strong); }
.privilege-public-card .title { font-size: 17px; font-weight: 700; color: var(--accent-gold); margin-bottom: 8px; }
.privilege-public-card .text { font-size: 15px; color: var(--text-secondary); line-height: 1.75; }
.privilege-action-reveal {
    width: min(100%, 760px);

    padding: 28px 26px;

    background:
        radial-gradient(circle at 50% 0%, rgba(215,185,131,0.22), transparent 48%),

}
.privilege-action-reveal .eyebrow { font-size: 18px; font-weight: 700; color: var(--accent-gold); letter-spacing: 1px; }
.privilege-action-reveal .action-text { margin: 16px 0; font-size: clamp(28px, 4vw, 48px); line-height: 1.32; font-weight: 700; color: var(--text-primary); }
.privilege-action-reveal .status { font-size: 17px; font-weight: 700; color: var(--accent-green); }
.privilege-action-reveal .note { margin-top: 10px; font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
.last-words-timer { font-size: 48px; font-weight: 700; color: var(--accent-gold); margin: 10px 0; }
.night-phase-timer,

}
.night-phase-timer .label,

.night-phase-timer .count,
.timed-action-timer .count { font-size: 46px; line-height: 1; font-weight: 700; color: var(--accent-gold); margin: 6px 0; }
.night-phase-timer .note { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
.timed-action-timer .count { margin-top: 6px; }
.night-prelude-screen {
    min-height: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
        radial-gradient(circle at 50% 42%, rgba(215,185,131,0.12), transparent 34%),
        radial-gradient(circle at 50% 50%, rgba(94,137,121,0.16), transparent 54%),
        #0a1718;
    border-radius: 34px;
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: var(--shadow-deep);
}
.night-prelude-title { font-size: clamp(46px, 7vw, 86px); line-height: 1.12; font-weight: 700; letter-spacing: 0.08em; color: var(--text-primary); }
.night-prelude-count { margin-top: 24px; font-size: clamp(54px, 8vw, 96px); line-height: 1; font-weight: 700; color: var(--accent-gold); }
.night-prelude-note { margin-top: 16px; color: var(--text-dim); font-size: 15px; }
.setup-layout { display: block; }
.setup-column { min-width: 0; }
.player-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.player-card {
    background: linear-gradient(155deg, rgba(29,48,44,0.92), rgba(16,32,31,0.92));
    border: 2px solid var(--border-color);
    border-radius: 18px;
    padding: 14px 8px;

    transition: var(--transition);

    box-shadow: 0 12px 26px rgba(0,0,0,0.22);
}
.player-card:active { transform: scale(0.96); }
.player-card.selected { border-color: var(--accent-green); background: rgba(157,201,175,0.1); box-shadow: 0 0 0 4px rgba(157,201,175,0.07); }

.player-card.dead .player-avatar { filter: grayscale(100%); }
.player-card .check-mark { position: absolute; top: 6px; right: 6px; font-size: 16px; display: none; }
.player-card.selected .check-mark { display: block; color: var(--accent-green); }
.player-avatar { font-size: 38px; line-height: 1; margin-bottom: 7px; }
.player-name { font-size: 14px; font-weight: 800; color: var(--text-primary); }
.night-target-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
.player-card.night-target-card { min-height: 126px; padding: 22px 10px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.player-card.night-target-card .check-mark { top: 10px; right: 10px; font-size: 24px; }
.player-card.night-target-card .player-avatar { font-size: 52px; margin-bottom: 12px; }
.player-card.night-target-card .player-name { font-size: 20px; font-weight: 700; line-height: 1.2; }
.target-wheel-area { display: flex; justify-content: center; margin: 16px auto 6px; }
.target-wheel-shell {
    --wheel-rotation: 0deg;
    --target-wheel-size: min(62vh, 88vw, 600px);
    --target-wheel-radius: min(25vh, 31vw, 218px);
    position: relative;
    width: var(--target-wheel-size);
    height: var(--target-wheel-size);
    min-width: 430px;
    min-height: 430px;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle, rgba(215,185,131,0.06) 0 24%, transparent 25%),
        repeating-conic-gradient(from 0deg, rgba(215,185,131,0.08) 0deg 1deg, transparent 1deg 30deg),
        radial-gradient(circle, #203b35, #102321 74%);
    border: 1px solid rgba(215,185,131,0.25);
    box-shadow: inset 0 0 0 9px rgba(215,185,131,0.025), 0 16px 50px rgba(0,0,0,0.18);
    touch-action: none;
}
.target-wheel-shell::before { content: ""; position: absolute; inset: 48px; border-radius: 50%; border: 1px solid rgba(215,185,131,0.16); }
.target-wheel-shell::after { content: ""; position: absolute; inset: 125px; border-radius: 50%; border: 1px solid rgba(215,185,131,0.26); }
.target-wheel-center {
    position: absolute; left: 50%; top: 50%; z-index: 4;
    width: 190px; height: 190px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    transform: translate(-50%, -50%) rotate(var(--wheel-rotation));
    background: radial-gradient(circle at 40% 20%, #344d3e, #1a302a 75%);
    border: 1px solid rgba(215,185,131,0.6);
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}
.target-wheel-center::before { content: ""; position: absolute; inset: 15px; border-radius: 50%; border: 1px solid rgba(215,185,131,0.2); pointer-events: none; }
.target-wheel-center::after { content: ""; position: absolute; top: 8px; left: 50%; width: 14px; height: 34px; border-radius: 99px; transform: translateX(-50%); background: linear-gradient(180deg, var(--accent-gold), transparent); pointer-events: none; }
.target-wheel-center-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.target-wheel-label { color: var(--text-dim); font-weight: 700; font-size: 12px; letter-spacing: 1px; }
.target-wheel-selected-name { margin-top: 6px; color: var(--accent-gold); font-size: 27px; font-weight: 700; line-height: 1.1; }
.target-wheel-confirm {
    margin-top: 10px; border: 1px solid rgba(245,228,192,0.3); border-radius: 999px;
    padding: 10px 18px; color: #25322b; background: #dcc18f;
    font-size: 15px; font-weight: 700; cursor: pointer;
}
.target-wheel-confirm:active { transform: scale(0.94); }
.target-wheel-node {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 2;
    width: 118px;
    height: 118px;
    transform-origin: center;
    border-radius: 18px;
    border: 2px solid var(--border-color);
    background: linear-gradient(160deg, rgba(29,48,44,0.98), rgba(16,32,31,0.98));
    box-shadow: 0 16px 34px rgba(0,0,0,0.3);

    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-primary);
    transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, scale 0.18s ease;
}
.target-wheel-node:active { scale: 0.95; }
.target-wheel-node .num {
    position: absolute; top: -17px; left: 50%;
    min-width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 999px; color: var(--accent-gold); background: #20362e;
    border: 1px solid rgba(215,185,131,0.5);

.target-wheel-node .avatar { font-size: 34px; line-height: 1; }

.target-wheel-node.selected {
    border-color: var(--accent-gold);

    box-shadow: 0 0 0 3px rgba(215,185,131,0.13);
}
.target-wheel-node.nearest {
    border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(215,185,131,0.1);
}
.target-action-layout { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.target-action-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.target-action-main { min-width: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }

.target-action-side .alert-box,
.target-action-side .night-phase-timer { margin: 0; }

.target-action-side .night-phase-timer .note { font-size: 12px; }
.target-action-phase { text-align: center; }
.target-action-label { font-size: 13px; font-weight: 700; color: var(--text-secondary); line-height: 1.5; }

.phase-badge { display: inline-block; padding: 7px 15px; border-radius: 999px; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; }
.phase-badge.night { background: rgba(185,177,204,0.16); color: #c9c4d8; border: 1px solid rgba(185,177,204,0.32); }

.log-entry:last-child { border-bottom: none; }

.log-entry.good { color: var(--accent-green); }

.role-reveal-card {

</div>

function randomInt(maxExclusive) {
    if (maxExclusive <= 0) return 0;
    const cryptoSource = globalThis.crypto || (globalThis.window && globalThis.window.crypto);
    if (cryptoSource && cryptoSource.getRandomValues) {
        const values = new Uint32Array(1);
        const limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
        do {
            cryptoSource.getRandomValues(values);
        } while (values[0] >= limit);
        return values[0] % maxExclusive;
    }
    return Math.floor(Math.random() * maxExclusive);
}

function randomChance(probability) {
    if (probability <= 0) return false;
    if (probability >= 1) return true;
    return randomInt(1000000) < Math.floor(probability * 1000000);
}

function randomItem(items) {
    return items[randomInt(items.length)];
}

function readUsedRandomDraws(storageKey) {
    try {
        const raw = globalThis.localStorage?.getItem(storageKey);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.filter(item => typeof item === 'string') : [];
    } catch (error) {
        return [];
    }
}

function writeUsedRandomDraws(storageKey, values) {
    try {
        globalThis.localStorage?.setItem(storageKey, JSON.stringify(values));
    } catch (error) {
        // localStorage 不可用时，本次页面仍可继续游戏，只是不持久记录。
    }
}

function drawNonRepeatingPersistentItem(items, storageKey) {
    const pool = Array.from(new Set(items.filter(Boolean)));
    if (!pool.length) return '';

    let used = readUsedRandomDraws(storageKey).filter(item => pool.includes(item));
    let available = pool.filter(item => !used.includes(item));
    if (!available.length) {
        used = [];
        available = pool;
    }

    const selected = randomItem(available) || '';
    if (selected) {
        used.push(selected);
        writeUsedRandomDraws(storageKey, Array.from(new Set(used)));
    }
    return selected;
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function addCause(causes, id, cause) {
    if (id === null || id === undefined) return;

function removeCause(causes, id, cause) {
    if (!causes[id]) return;
    causes[id].delete(cause);
    if (causes[id].size === 0) delete causes[id];
}

function hasCause(causes, id, cause) {
    return Boolean(causes[id] && causes[id].has(cause));

function causeText(causes, id) {

function parseGameTextMarkdown(markdown) {
    const result = {};
    let currentKey = null;
    let buffer = [];

    function commit() {
        if (!currentKey) return;
        result[currentKey] = buffer.join('\n').trim();
    }

    markdown.split(/\r?\n/).forEach(line => {
        const match = line.match(/^##\s+(.+?)\s*$/);
        if (match) {
            commit();
            currentKey = match[1].trim();
            buffer = [];
            return;
        }
        if (currentKey) buffer.push(line);
    });
    commit();
    return result;
}

    } catch (error) {

}

function nextGodVoiceLine(key, data = {}) {
    const prefix = `voice.${key}`;
    const catalog = { ...DEFAULT_GAME_TEXT, ...GAME_TEXT };
    // 按原始模板去重：夜数变化不应让同一句话再次进入本轮候选。
    const templates = Array.from(new Set(Object.entries(catalog)
        .filter(([name]) => name === prefix || (name.startsWith(`${prefix}.`)
            && /^\d+$/.test(name.slice(prefix.length + 1))))
        .map(([, value]) => typeof value === 'string' ? value.trim() : '')
        .filter(Boolean)));
    if (!templates.length) return '';

    const storageKey = `werewolf-voice-history-${key}`;
    let history = godVoiceHistory.get(key);
    if (!history) {
        history = { used: [], last: '' };
        try {
            if (typeof localStorage !== 'undefined') {
                const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
                if (saved && typeof saved === 'object') {
                    history.used = Array.isArray(saved.used)
                        ? saved.used.filter(item => typeof item === 'string') : [];
                    history.last = typeof saved.last === 'string' ? saved.last : '';
                }
            }
        } catch (error) { /* 存储不可用或旧记录损坏时，仍在当前页面内轮换。 */ }
    }
    let used = history.used.filter(item => templates.includes(item));
    let available = templates.filter(item => !used.includes(item));
    if (!available.length) {
        used = [];
        // 开启新一轮时，也不紧接着重复上一轮最后一句。
        available = templates.length > 1
            ? templates.filter(item => item !== history.last) : templates;
    }
    const chosen = available[randomInt(available.length)];
    const nextHistory = { used: [...used, chosen], last: chosen };
    godVoiceHistory.set(key, nextHistory);
    try {
        if (typeof localStorage !== 'undefined') {
            localStorage.setItem(storageKey, JSON.stringify(nextHistory));
        }
    } catch (error) { /* 页面内记录继续生效，不影响对局存档。 */ }
    return formatText(chosen, data);
}

let godVoiceAudio = null;
let godVoicePlaybackToken = 0;
let gameOpeningId = 0;

const GOD_VOICE_FILES = {
    voiceOn: 'voiceOn',
    gameStart: 'gameStart',
    prophetCheck: 'prophetCheck',
    gargoyleCheck: 'gargoyleCheck',
    wolfAction: 'wolfAction',
    gargoyleKill: 'gargoyleKill',
    witchAction: 'witchAction',
    guardianAction: 'guardianAction',
    nightToDayTransition: 'nightToDayTransition',
    dayStart: 'dayStart',
    voteStart: 'voteStart',
    voteResult: 'voteResult'
};

function godVoiceFile(key, data = {}) {
    if (key === 'nightStart') {
        const day = Number(data.day);
        if (Number.isInteger(day) && day >= 1 && day <= 10) return `nightStart_${day}`;
        return '';
    }
    return GOD_VOICE_FILES[key] || '';
}

function stopGodVoicePlayback() {
    godVoicePlaybackToken += 1;
    if (godVoiceAudio) {
        try { godVoiceAudio.onended = null; } catch (error) { /* 播放器已释放时忽略。 */ }
        try { godVoiceAudio.pause(); } catch (error) { /* 播放器已释放时忽略。 */ }
    }
    if (typeof window !== 'undefined' && window.speechSynthesis
        && typeof window.speechSynthesis.cancel === 'function') {
        try { window.speechSynthesis.cancel(); } catch (error) { /* 系统朗读不可用时忽略。 */ }
    }
}

function ensureGodVoiceAudio() {
    if (!godVoiceAudio) godVoiceAudio = new Audio();
    return godVoiceAudio;
}

function recordedGodVoiceLine(key, data = {}) {
    const template = DEFAULT_GAME_TEXT[`voice.${key}`];
    if (typeof template !== 'string' || !template.trim()) return '';
    return formatText(template.trim(), data);
}

function speakUtterance(line, finish) {
    if (!line || typeof window === 'undefined' || !window.speechSynthesis
        || typeof SpeechSynthesisUtterance === 'undefined') {
        finish();
        return;
    }
    try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(line);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.95;
        utterance.pitch = 1;
        utterance.onend = () => finish();
        utterance.onerror = () => finish();
        window.speechSynthesis.speak(utterance);
    } catch (error) {
        finish();
    }
}

function speakGodLine(key, data = {}, onDone) {
    const finishNow = () => { if (typeof onDone === 'function') onDone(); };
    if (!godVoiceEnabled || typeof window === 'undefined') {
        finishNow();
        return;
    }
    const file = godVoiceFile(key, data);
    const canPlayAudio = Boolean(file) && typeof Audio === 'function';
    const canSpeak = Boolean(window.speechSynthesis) && typeof SpeechSynthesisUtterance !== 'undefined';
    if (!canPlayAudio && !canSpeak) {
        finishNow();
        return;
    }
    stopGodVoicePlayback();
    const token = godVoicePlaybackToken;
    let settled = false;
    const finish = () => {
        if (settled || token !== godVoicePlaybackToken) return;
        settled = true;
        if (typeof onDone === 'function') onDone();
    };
    if (canPlayAudio) {
        try {
            const audio = ensureGodVoiceAudio();
            try { audio.pause(); } catch (error) { /* 同一播放器切句时忽略。 */ }
            audio.onended = null;
            audio.src = `audio/god/${file}.mp3`;
            audio.onended = () => finish();
            let played;
            try {
                played = audio.play();
            } catch (error) {
                audio.onended = null;
                speakUtterance(recordedGodVoiceLine(key, data), finish);
                return;
            }
            if (played && typeof played.catch === 'function') {
                played.catch(() => {
                    if (token !== godVoicePlaybackToken) return;
                    try { audio.onended = null; } catch (error) { /* 播放器已释放时忽略。 */ }
                    speakUtterance(recordedGodVoiceLine(key, data), finish);
                });
            }
            return;
        } catch (error) {
            speakUtterance(recordedGodVoiceLine(key, data), finish);
            return;
        }
    }
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
        finish();
        return;
    }
    speakUtterance(nextGodVoiceLine(key, data), finish);
}

function startLastWordsTimer(seconds = 30) {

    let remaining = restoredTimerSeconds('lastWordsRemaining', seconds);
    gameState.lastWordsRemaining = remaining;
    const countdown = document.getElementById('last-words-countdown');
    const hint = document.getElementById('last-words-hint');

    function render() {
        if (countdown) countdown.textContent = remaining;
        if (hint) hint.textContent = remaining > 0
            ? '可等待遗言倒计时，也可以直接继续。'
            : '遗言时间结束，可以继续。';
    }

    render();
    if (remaining <= 0) return;
    lastWordsTimerId = setInterval(() => {
        remaining = Math.max(0, remaining - 1);
        gameState.lastWordsRemaining = remaining;
        render();
        saveGameSnapshot();
        if (remaining <= 0) {
            clearLastWordsTimer();
        }
    }, 1000);
}

function clearNightTransitionTimer() {
    if (nightTransitionTimerId) {
        clearInterval(nightTransitionTimerId);
        nightTransitionTimerId = null;
    }
}

function showNightToDayTransition(seconds = 15) {
    clearNightTransitionTimer();
    let remaining = restoredTimerSeconds('nightTransitionRemaining', seconds);
    gameState.nightTransitionRemaining = remaining;

    document.getElementById('game-phase-text').textContent = `第${gameState.dayNumber}夜 · 夜晚结束`;
    document.getElementById('game-content').innerHTML = `
        <div style="text-align:center;padding:24px 0;">
            <span class="phase-badge night">${text('night.transition.phase')}</span>
            <div class="dawn-card" style="margin-top:16px;">
                <div style="font-size:44px;margin-bottom:10px;">🤫</div>
                <div style="font-size:22px;font-weight:900;color:var(--accent-yellow);">${text('night.transition.title')}</div>
                <div style="font-size:14px;color:var(--text-secondary);margin-top:8px;">${text('night.transition.subtitle')}</div>
                <div class="last-words-timer"><span id="night-transition-countdown">${remaining}</span>s</div>
            </div>
            <div class="info-box" style="margin-top:16px;text-align:left;">
                <div>${text('night.transition.rule1')}</div>
                <div>${text('night.transition.rule2')}</div>
            </div>
        </div>

        <button class="btn btn-ghost btn-block" onclick="finishNightToDayTransition()">${text('night.transition.skip')}</button>

        gameState.nightTransitionRemaining = remaining;

        if (countdown) countdown.textContent = remaining;
        if (remaining > 0) saveGameSnapshot();
        if (remaining <= 0) {
            finishNightToDayTransition();
        }
    }, 1000);
    setGameResumeView('nightTransition');
}

function finishNightToDayTransition() {
    clearNightTransitionTimer();
    beginNightHunterConfirmations();
}

function clearNightRoleTimer() {
    if (nightRoleTimerId) {
        clearInterval(nightRoleTimerId);
        nightRoleTimerId = null;
    }
}

function renderNightRoleTimer() {
    const countdown = document.getElementById('night-role-countdown');
    if (countdown) countdown.textContent = gameState.nightRoleTimerRemaining;
}

function resetNightRoleTimer() {
    if (!nightRoleTimerId || !gameState.nightRoleNextAction) return;
    gameState.nightRoleTimerRemaining = gameState.nightRoleTimerDuration || NIGHT_ROLE_PHASE_SECONDS;
    renderNightRoleTimer();
}

function clearNightPreludeTimer() {
    if (nightPreludeTimerId) {
        clearInterval(nightPreludeTimerId);
        nightPreludeTimerId = null;
    }
}

function shouldShowNightPrelude(action) {
    if (restoringGameSnapshot) return false;
    if (gameState.nightPreludeBypassAction === action) {
        gameState.nightPreludeBypassAction = null;
        return false;
    }
    showNightPrelude(action);
    return true;
}

function showNightPrelude(nextAction, seconds = NIGHT_PRELUDE_SECONDS) {
    clearNightPreludeTimer();
    clearNightRoleTimer();
    gameState.nightPreludeNextAction = nextAction;
    let remaining = restoredTimerSeconds('nightPreludeRemaining', seconds);
    gameState.nightPreludeRemaining = remaining;

    document.getElementById('game-phase-text').textContent = `第${gameState.dayNumber}夜`;
    document.getElementById('game-content').innerHTML = `
        <div class="night-prelude-screen">
            <div class="night-prelude-title">天黑请闭眼</div>
            <div class="night-prelude-count"><span id="night-prelude-countdown">${remaining}</span>s</div>
            <div class="night-prelude-note">倒计时结束后进入下一位角色流程。</div>
        </div>
    `;
    document.getElementById('game-bottom-bar').innerHTML = `
        <button class="btn btn-ghost btn-block" onclick="finishNightPrelude()">${text('night.timer.skip')}</button>
    `;

    nightPreludeTimerId = setInterval(() => {
        remaining = Math.max(0, remaining - 1);
        gameState.nightPreludeRemaining = remaining;
        const countdown = document.getElementById('night-prelude-countdown');
        if (countdown) countdown.textContent = Math.max(remaining, 0);
        if (remaining > 0) saveGameSnapshot();
        if (remaining <= 0) {
            finishNightPrelude();
        }
    }, 1000);
    setGameResumeView('nightPrelude', nextAction);
}

function finishNightPrelude() {
    clearNightPreludeTimer();
    const action = gameState.nightPreludeNextAction;
    gameState.nightPreludeNextAction = null;
    if (!action) return;
    gameState.nightPreludeBypassAction = action;
    runNightPreludeAction(action);
}

function runNightPreludeAction(action) {
    if (action === 'prophet') return showNightProphetCheck();
    if (action === 'gargoyleCheck') return showNightGargoyleCheck();
    if (action === 'wolf') return showNightWolfKill();
    if (action === 'gargoyleKill') return showNightGargoyleKill();
    if (action === 'witch') return showNextWitch();
    if (action === 'guardian') return showNightGuardian();
}

function nightRoleTimerHtml(seconds = NIGHT_ROLE_PHASE_SECONDS) {
    return `
        <div class="night-phase-timer">
            <div class="label">${text('night.timer.label')}</div>
            <div class="count"><span id="night-role-countdown">${seconds}</span>s</div>
            <div class="note" id="night-role-timer-note">${text('night.timer.note')}</div>
        </div>
    `;
}

function targetActionLayoutHtml({ phaseText, phaseClass = 'night', infoHtml = '', timerHtml = '', targetLabel = '', wheelHtml = '', sideExtraHtml = '' }) {
    return `
        <div class="target-action-layout">
            <aside class="target-action-side">
                ${phaseText ? `<div class="target-action-phase"><span class="phase-badge ${phaseClass}">${phaseText}</span></div>` : ''}
                ${infoHtml}
                ${timerHtml}
                ${targetLabel ? `<div class="target-action-label">${targetLabel}</div>` : ''}
                ${sideExtraHtml}
            </aside>
            <section class="target-action-main">
                ${wheelHtml}
            </section>
        </div>
    `;
}

function startNightRoleTimer(nextAction, seconds = NIGHT_ROLE_PHASE_SECONDS) {
    clearNightRoleTimer();
    gameState.nightRoleNextAction = nextAction;
    gameState.nightRoleTimerDuration = seconds;
    gameState.nightRoleTimerRemaining = restoredTimerSeconds('nightRoleTimerRemaining', seconds);

    renderNightRoleTimer();
    if (gameState.nightRoleTimerRemaining <= 0) {
        holdNightRoleTimerForConfirm();
        return;
    }
    nightRoleTimerId = setInterval(() => {
        gameState.nightRoleTimerRemaining -= 1;
        renderNightRoleTimer();
        if (gameState.nightRoleTimerRemaining > 0) saveGameSnapshot();
        if (gameState.nightRoleTimerRemaining <= 0) {
            // 到时只停表，保留已选目标；「直接继续」才放弃本动作。
            holdNightRoleTimerForConfirm();
        }
    }, 1000);
}

function nightRoleTimerHasPendingSelection() {
    const action = gameState.nightRoleNextAction;
    if (action === 'afterProphet') return gameState.prophetCheckTarget !== null;
    if (action === 'afterGargoyleCheck') return gameState.gargoyleCheckTarget !== null;
    if (action === 'afterWolf') return gameState.nightKillTarget !== null;
    if (action === 'afterGargoyleKill') return gameState.gargoyleKillTarget !== null;
    if (action === 'afterWitch') {
        const id = gameState.currentWitchId;
        return id !== null && id !== undefined &&
            (gameState.witchSaveTargets[id] !== undefined || gameState.witchPoisonTargets[id] !== undefined);
    }
    if (action === 'afterGuardian') return gameState.guardianTarget !== null;
    return false;
}

function holdNightRoleTimerForConfirm() {
    // 停表等待确认：只停 interval，不清目标和 nightRoleNextAction，「直接继续」仍可用
    if (nightRoleTimerId) {
        clearInterval(nightRoleTimerId);
        nightRoleTimerId = null;
    }
    gameState.nightRoleTimerRemaining = 0;
    const countdown = document.getElementById('night-role-countdown');
    if (countdown) countdown.textContent = 0;
    const note = document.getElementById('night-role-timer-note');
    if (note) note.textContent = '倒计时已结束，等待点击确认，或点「直接继续」。';
    saveGameSnapshot();
}

function finishNightRoleTimer() {
    clearNightRoleTimer();
    const action = gameState.nightRoleNextAction;
    gameState.nightRoleNextAction = null;

    if (action === 'afterProphet') {
        gameState.prophetCheckTarget = null;
        showNightGargoyleCheck();
        return;
    }
    if (action === 'afterGargoyleCheck') {
        gameState.gargoyleCheckTarget = null;
        showNightWolfKill();
        return;
    }
    if (action === 'afterWolf') {
        gameState.nightKillTarget = null;
        showNightGargoyleKill();
        return;
    }
    if (action === 'afterGargoyleKill') {
        gameState.gargoyleKillTarget = null;
        startWitchPhase();
        return;
    }
    if (action === 'afterWitch') {
        advanceWitchWithoutAction(false);
        return;
    }
    if (action === 'afterGuardian') {
        skipGuardianGuard();
        return;
    }
    if (action === 'checkResult') {
        nextNightStep();
        return;
    }
}

function showNightRoleWait({ phaseTitle, prompt, nextAction, voiceKey }) {
    document.getElementById('game-phase-text').textContent = `第${gameState.dayNumber}夜 · ${phaseTitle.replace(/^🌙\s*/, '')}`;

// ---- 对局存档：保存可停留的子步骤，恢复只渲染，不重放行动/随机结算 ----
const GAME_SNAPSHOT_KEY = 'werewolf-game-snapshot';
const GAME_SNAPSHOT_VERSION = 2;
let restoringGameSnapshot = false;

function gameResumeRenderers() {
    return {
        nightPrelude: action => showNightPrelude(action),
        nightRole: action => runNightPreludeAction(action),
        nightWait: options => showNightRoleWait(options),
        checkResult: (...args) => showCheckResult(...args),
        mindReadHandoff: () => showMindReadHandoff(),
        mindReadResult: () => showMindReadResult(),
        nightTransition: () => showNightToDayTransition(),
        hunterNightHandoff: id => showNightHunterHandoff(id),
        dayOverview: () => renderDayOverview(),
        dayLastWords: () => showNextDayLastWords(),
        daySpeech: () => showNextDaySpeech(),
        daySpeechComplete: () => showDaySpeechComplete(),
        vote: () => showNextVoter(),
        revoteIntro: () => renderRevoteIntro(),
        voteResult: (id, cause) => renderVoteResult(id, cause),
        exilePunishment: id => showExilePunishment(id),
        eliminationHandoff: id => showEliminationHandoff(id),
        eliminationPrivate: id => showEliminationPrivate(id),
        hunterDay: id => hunterShoot(id),
        hunterNight: id => showNightHunterShoot(id)
    };
}

function setGameResumeView(key, ...args) {
    gameState.resumeView = { key, args };
    saveGameSnapshot();
}

function restoredTimerSeconds(field, fallback) {
    const remaining = gameState[field];
    return restoringGameSnapshot && Number.isFinite(remaining)
        ? Math.max(0, remaining) : fallback;
}

function saveGameSnapshot() {
    try {
        if (restoringGameSnapshot || typeof localStorage === 'undefined') return;
        if (!gameState || !Array.isArray(gameState.players) || gameState.players.length === 0) return;
        if (gameState.winner) return;
        if (![PHASE.NIGHT, PHASE.DAY, PHASE.VOTE].includes(gameState.phase) || !gameState.resumeView) return;
        localStorage.setItem(GAME_SNAPSHOT_KEY, JSON.stringify(
            { schemaVersion: GAME_SNAPSHOT_VERSION, checkpoint: gameState.phase,
                day: gameState.dayNumber, state: gameState,
                houseRules: { tieVoteRevote, witchSavePoisonExclusive } },
            (key, value) => value instanceof Set ? { __set: Array.from(value) } : value
        ));
    } catch (e) { /* 存储不可用时静默降级，不影响游戏 */ }
}

function clearGameSnapshot() {
    try {
        if (typeof localStorage !== 'undefined') localStorage.removeItem(GAME_SNAPSHOT_KEY);
    } catch (e) { /* 同上 */ }
}

function readGameSnapshot() {
    try {
        if (typeof localStorage === 'undefined') return null;
        const raw = localStorage.getItem(GAME_SNAPSHOT_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw, (key, value) =>
            (value && typeof value === 'object' && Array.isArray(value.__set)) ? new Set(value.__set) : value);
        if (!data || !data.state || !Array.isArray(data.state.players) || data.state.players.length === 0) return null;
        if (data.schemaVersion !== undefined && data.schemaVersion !== GAME_SNAPSHOT_VERSION) return null;
        if (data.schemaVersion === GAME_SNAPSHOT_VERSION) {
            const view = data.state.resumeView;
            if (!view || !Object.prototype.hasOwnProperty.call(gameResumeRenderers(), view.key) || !Array.isArray(view.args)) return null;
            if (![PHASE.NIGHT, PHASE.DAY, PHASE.VOTE].includes(data.state.phase)) return null;
        } else if (!['night', 'day', 'vote'].includes(data.checkpoint)) {
            return null;
        }
        if (data.state.players.some(p => !p || !Object.values(ROLE).some(role => role.key === p.roleKey))) return null;
        return data;
    } catch (e) {
        return null;
    }
}

function restoreSavedGame() {
    const data = readGameSnapshot();
    if (!data) return;
    clearGameTimers();
    playerCount = data.state.playerCount || playerCount;
    gameState = { ...createInitialGameState(playerCount), ...data.state };
    // 重绑玩家引用：猎人队列中的对象也必须指向本局玩家。
    gameState.players.forEach(p => {
        p.role = Object.values(ROLE).find(r => r.key === p.roleKey);
    });
    gameState.hunterQueue = gameState.hunterQueue
        .map(player => getPlayerById(typeof player === 'number' ? player : player.id)).filter(Boolean);
    if (data.houseRules) {
        tieVoteRevote = Boolean(data.houseRules.tieVoteRevote);
        witchSavePoisonExclusive = Boolean(data.houseRules.witchSavePoisonExclusive);
    }
    showScreen('screen-game');
    acquireWakeLock();
    if (data.schemaVersion === GAME_SNAPSHOT_VERSION) {
        const view = gameState.resumeView;
        restoringGameSnapshot = true;
        try {
            gameResumeRenderers()[view.key](...view.args);
        } finally {
            restoringGameSnapshot = false;
        }
        saveGameSnapshot();
        return;
    }
    // 兼容旧版阶段级存档：旧文件没有子步骤，只能从旧检查点恢复一次。
    if (data.checkpoint === 'day') startDayPhase();
    else if (data.checkpoint === 'vote') startVotePhase();
    else startNightPhase();
}

function discardSavedGame() {
    clearGameSnapshot();
    renderResumeBanner();
}

function renderResumeBanner() {
    if (typeof document === 'undefined' || !document.querySelector) return;
    const homeButtons = document.querySelector('#screen-home .home-buttons');
    if (!homeButtons || !homeButtons.parentNode) return;
    const existing = document.getElementById('resume-banner');
    if (existing && existing.remove) existing.remove();
    const data = readGameSnapshot();
    if (!data) return;
    const phaseText = data.checkpoint === 'night' ? `第${data.day}夜` : `第${data.day}天`;
    const banner = document.createElement('div');
    banner.id = 'resume-banner';
    banner.className = 'card';
    banner.style.cssText = 'margin-bottom:12px;text-align:center;padding:14px;';
    banner.innerHTML = `
        <div style="font-size:14px;margin-bottom:10px;">🎲 发现未完成的对局：${data.state.playerCount}人局 · ${phaseText}</div>
        <button class="btn btn-primary btn-block" onclick="restoreSavedGame()">▶️ 继续上一局</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="discardSavedGame()">🗑️ 放弃存档</button>
    `;
    homeButtons.parentNode.insertBefore(banner, homeButtons);
}

function captureCurrentPlayerSetup() {
    const count = gameState.playerCount || playerCount;
    const inputs = Array.from(document.querySelectorAll('.name-input'));
    const genders = Array.from(document.querySelectorAll('.gender-toggle'));

    if (inputs.length >= count && genders.length >= count) {
        return {
            count,
            players: inputs.slice(0, count).map((input, index) => ({
                name: input.value || `玩家${index + 1}`,
                gender: genders[index].dataset.gender || 'male'
            }))
        };
    }

    return {
        count,
        players: gameState.players.slice(0, count).map((player, index) => ({
            name: player.name || `玩家${index + 1}`,
            gender: player.gender || 'male'
        }))
    };
}

function applyPlayerSetupToInputs(setup) {
    playerCount = setup.count;
    renderNameInputs();

    const inputs = Array.from(document.querySelectorAll('.name-input'));
    const genders = Array.from(document.querySelectorAll('.gender-toggle'));
    setup.players.forEach((player, index) => {
        if (inputs[index]) inputs[index].value = player.name;
        if (genders[index]) {
            genders[index].dataset.gender = player.gender;
            genders[index].textContent = player.gender === 'female' ? '👩' : '👨';
        }
    });
}

function restartGameSamePlayers() {
    const setup = captureCurrentPlayerSetup();
    clearGameTimers();
    clearGameSnapshot();
    gameState = createInitialGameState(setup.count);
    applyPlayerSetupToInputs(setup);
    setupGame();
}

function selectPlayerCount(count) {
    playerCount = count;
    gameState.playerCount = count;

    // 更新按钮样式
    [5, 6, 7, 8, 9, 10].forEach(n => {
        document.getElementById(`btn-${n}p`).className = count === n
            ? 'btn btn-secondary btn-sm'
            : 'btn btn-ghost btn-sm';
    });

    const cfg = getConfig(count);
    document.getElementById('selected-mode-desc').textContent = cfg.desc;

    renderNameInputs();
    updateConfigPreview();
}

function updateConfigPreview() {
    const cfg = getConfig(playerCount);
    const preview = document.getElementById('config-preview');
    const info = document.getElementById('config-info');

    // 统计角色数量
    const roleCounts = {};
    cfg.roles.forEach(r => {
        roleCounts[r.key] = (roleCounts[r.key] || 0) + 1;
    });

    // 生成预览HTML
    const roleItems = Object.entries(roleCounts).map(([key, count]) => {
        const role = Object.values(ROLE).find(r => r.key === key);
        const alignmentClass = role.alignment === ALIGNMENT.GOOD ? 'good' : 'wolf';
        const alignmentText = role.alignment === ALIGNMENT.GOOD ? '好人阵营' : '狼人阵营';
        return `
            <div class="role-detail-card">
                <div class="role-detail-header">
                    <div class="role-detail-title">${role.emoji} ${role.name}<span class="role-detail-count">×${count}</span></div>
                    <div class="alignment-label ${alignmentClass}">${alignmentText}</div>
                </div>
                <div class="role-detail-desc">${role.desc}</div>
            </div>
        `;
    }).join('');

    preview.innerHTML = roleItems;

    const goodCount = cfg.roles.filter(r => r.alignment === ALIGNMENT.GOOD).length;
    const wolfCount = cfg.roles.filter(r => r.alignment === ALIGNMENT.WOLF).length;
    info.innerHTML = `
        <div>👥 ${playerCount}人局：${wolfCount}狼人 vs ${goodCount}好人</div>
        <div>🎴 所有女性头像玩家各获得1张特权卡</div>
        <div>${text('rules.voteBase', { good: cfg.goodVotePower })}</div>
        ${!cfg.witchCanSelfSave ? '<div>⚠️ 女巫不能自救</div>' : '<div>💊 女巫可自救（1次，不消耗解药）</div>'}
        ${cfg.prophetImmuneNights > 0 ? `<div>🛡️ 预言家前${cfg.prophetImmuneNights}夜免疫夜间死亡</div>` : ''}
    `;
}

function renderNameInputs() {
    const container = document.getElementById('name-inputs');
    container.innerHTML = '';
    for (let i = 0; i < playerCount; i++) {
        const row = document.createElement('div');
        row.className = 'name-input-row';
        row.innerHTML = `
            <button class="gender-toggle" data-index="${i}" data-gender="male" onclick="toggleGender(this)">👨</button>
            <input type="text" class="name-input" placeholder="玩家${i + 1}名称" data-index="${i}" value="玩家${i + 1}">
        `;
        container.appendChild(row);
    }
}

function toggleGender(btn) {
    const isMale = btn.dataset.gender === 'male';
    btn.dataset.gender = isMale ? 'female' : 'male';
    btn.textContent = isMale ? '👩' : '👨';
}

function setupGame() {
    const cfg = getConfig(playerCount);

    // 读取玩家名称和性别
    const inputs = document.querySelectorAll('.name-input');
    const genders = document.querySelectorAll('.gender-toggle');

    gameState.players = [];
    for (let i = 0; i < playerCount; i++) {
        gameState.players.push({
            id: i,
            name: escapeHtml(inputs[i].value) || `玩家${i + 1}`,

function getNumberedGameTextValues(prefix) {
    const escapedPrefix = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const pattern = new RegExp(`^${escapedPrefix}\\.(\\d+)$`);

    return Object.keys(GAME_TEXT)
        .map(key => {
            const match = key.match(pattern);
            return match ? { key, order: Number(match[1]) } : null;
        })
        .filter(Boolean)
        .sort((a, b) => a.order - b.order)
        .map(item => ({ key: item.key, value: text(item.key) }))
        .filter(item => item.value && item.value !== item.key)
        .map(item => item.value);
}

function parseTimeCount(token) {
    if (/^\d+$/.test(token)) return Number(token);
    const chineseNumbers = {
        一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5,
        六: 6, 七: 7, 八: 8, 九: 9
    };
    if (token === '十') return 10;
    if (token.length === 1) return chineseNumbers[token] || 0;
    if (token.startsWith('十')) return 10 + (chineseNumbers[token[1]] || 0);
    if (token.endsWith('十')) return (chineseNumbers[token[0]] || 0) * 10;
    if (token.includes('十')) {
        const [tens, ones] = token.split('十');
        return (chineseNumbers[tens] || 0) * 10 + (chineseNumbers[ones] || 0);
    }
    return 0;
}

function extractTimeLimitSeconds(value) {
    const textValue = String(value || '');
    const secondMatch = textValue.match(/(\d+|[一二两三四五六七八九十]{1,3})\s*秒/);
    if (secondMatch) return parseTimeCount(secondMatch[1]);
    const minuteMatch = textValue.match(/(\d+|[一二两三四五六七八九十]{1,3})\s*分钟/);
    if (minuteMatch) return parseTimeCount(minuteMatch[1]) * 60;
    return 0;
}

function timedActionCountdownHtml(actionText, elementId) {
    const seconds = extractTimeLimitSeconds(actionText);
    if (!seconds) return '';
    return `
        <div class="timed-action-timer">
            <div class="label">动作倒计时</div>
            <div class="count"><span id="${elementId}">${seconds}</span>s</div>
        </div>
    `;
}

function clearTimedActionCountdown() {
    if (timedActionTimerId) {
        clearInterval(timedActionTimerId);
        timedActionTimerId = null;
    }
}

function startTimedActionCountdown(actionText, elementId) {
    clearTimedActionCountdown();
    let remaining = extractTimeLimitSeconds(actionText);
    const countdown = document.getElementById(elementId);
    if (!remaining || !countdown) return;

    countdown.textContent = remaining;
    timedActionTimerId = setInterval(() => {
        remaining -= 1;
        countdown.textContent = Math.max(remaining, 0);
        if (remaining <= 0) {
            clearTimedActionCountdown();
        }
    }, 1000);
}

        startNightPhase();

// ---- Wake Lock：游戏期间防止设备自动锁屏 ----
let wakeLockSentinel = null;

function acquireWakeLock() {
    try {
        if (typeof navigator === 'undefined' || !navigator.wakeLock || !navigator.wakeLock.request) return;
        navigator.wakeLock.request('screen').then(sentinel => {
            wakeLockSentinel = sentinel;
        }).catch(() => { /* 低电量模式等场景会被拒绝，忽略 */ });
    } catch (e) { /* 不支持的浏览器静默降级 */ }
}

function releaseWakeLock() {
    try {
        if (wakeLockSentinel) {
            wakeLockSentinel.release().catch(() => {});
            wakeLockSentinel = null;
        }
    } catch (e) { /* 同上 */ }
}

// 夜晚阶段
// =====================================================

function startNightPhase() {
    clearNightTransitionTimer();
    clearNightRoleTimer();
    gameState.phase = PHASE.NIGHT;
    gameState.deathsTonight = new Set();
    gameState.deathCauses = {};
    gameState.nightKillTarget = null;
    gameState.gargoyleKillTarget = null;
    gameState.prophetCheckTarget = null;
    gameState.gargoyleCheckTarget = null;
    gameState.witchSelfSave = false;
    gameState.witchCure = false;
    gameState.witchPoison = false;
    gameState.currentWitchIndex = 0;
    gameState.currentWitchId = null;
    gameState.witchSaveTargets = {};
    gameState.witchPoisonTargets = {};
    gameState.witchPoisonTarget = null;
    gameState.guardianTarget = null;
    gameState.activeCheckers = [];
    gameState.mindReadQueue = null;
    gameState.mindReadIndex = 0;
    gameState.mindReadDeliveryDone = false;
    gameState.players.forEach(p => { p.mindReadCheckerIds = []; p.mindReadInfo = ''; });
    gameState.targetWheelRotations = {};
    gameState.hunterQueue = [];
    gameState.hunterQueueMode = 'night';
    gameState.nightRoleNextAction = null;

    // 重置每轮效果
    getAlivePlayers().forEach(p => {
        p.votePower = p.baseVotePower;
        p.immuneTonight = false;
        p.silencedToday = false;
        p.skillSealed = false;
    });

    log(`======== 第${gameState.dayNumber}夜 ========`, 'info');
    speakGodLine('nightStart', { day: gameState.dayNumber });

    // 预言家免疫夜间死亡
    const cfg = getConfig(gameState.playerCount);
    if (gameState.dayNumber <= cfg.prophetImmuneNights) {
        const prophet = getAlivePlayers().find(p => p.roleKey === 'prophet');
        if (prophet) {
            prophet.immuneTonight = true;
            log(`🛡️ 预言家 ${prophet.name} 第${gameState.dayNumber}夜免疫夜间死亡`, 'good');
        }
    }

    // 应用特权卡效果（夜晚开始时生效）
    applyNightCards();

    // 检查石像鬼觉醒
    checkGargoyleAwaken();

    // 夜晚流程：预言家 → 石像鬼 → 狼人 → 觉醒石像鬼 → 女巫 → 守卫 → 结算
    showNightProphetCheck();
}

function applyNightCards() {
    gameState.players.forEach(holder => {
        if (!isCardActive(holder)) return;
        const card = holder.card;
        const target = getPlayerById(holder.cardTargetId);

        if (card.id === 'NO_SKILL' && target && target.alive) {
            target.skillSealed = playerHasNightSkill(target);
            holder.cardUsed = true;
            log(`🔒 技能封印生效：${target.name} 今晚不能使用技能`, 'wolf');
        } else if (card.id === 'IMMUNITY' && target && target.alive) {
            target.immuneTonight = true;
            holder.cardUsed = true;
            log(`🛡️ 免疫卡生效：${target.name} 只挡当晚的刀、毒和夜间猎枪，不挡白天放逐和白天枪击`, 'good');
        } else if (card.id === 'MIST') {
            log(`🌫️ 迷雾生效：今晚所有查验结果随机`, 'info');
        } else if (card.id === 'MIND_READ' && target && target.alive) {
            log(`👂 心声聆听待命：若 ${target.name} 今晚被查验，${target.name} 会得知是谁查验了自己`, 'good');
        }
    });
}

function getTargetWheelRotation(action) {
    if (!gameState.targetWheelRotations) gameState.targetWheelRotations = {};
    if (gameState.targetWheelRotations[action] === undefined) {
        gameState.targetWheelRotations[action] = -90;
    }
    return gameState.targetWheelRotations[action];
}

function setTargetWheelRotation(action, rotation) {
    if (!gameState.targetWheelRotations) gameState.targetWheelRotations = {};
    gameState.targetWheelRotations[action] = rotation;
}

function getSelectedTargetForAction(action) {
    if (action === 'nightKill') return gameState.nightKillTarget;
    if (action === 'gargoyleKill') return gameState.gargoyleKillTarget;
    if (action === 'prophetCheck') return gameState.prophetCheckTarget;
    if (action === 'gargoyleCheck') return gameState.gargoyleCheckTarget;
    if (action === 'witchSave') return gameState.witchSaveTargets[gameState.currentWitchId];
    if (action === 'witchPoison') return gameState.witchPoisonTargets[gameState.currentWitchId];
    if (action === 'guardian') return gameState.guardianTarget;
    if (action === 'cardActivation') return gameState.selectedTarget;
    if (action === 'hunterShoot') return gameState.selectedTarget;
    return gameState.selectedTarget;
}

function targetWheelNodeStyle(index, total, rotation) {
    const angle = index * (360 / total) + rotation;
    return `translate(-50%, -50%) rotate(${angle}deg) translateX(var(--target-wheel-radius)) rotate(-90deg)`;
}

function targetWheelHtml(players, action, confirmLabel, confirmCommand, confirmArg = null) {
    if (!players.length) {
        return `<div class="info-box">当前没有可选择的目标。</div>`;
    }

    const rotation = getTargetWheelRotation(action);
    const selectedId = getSelectedTargetForAction(action);
    const selectedPlayer = players.find(player => player.id === selectedId);
    const selectedName = selectedPlayer ? selectedPlayer.name : '请选择';
    const playerIds = players.map(player => player.id).join(',');
    const argText = confirmArg === null || confirmArg === undefined ? 'null' : String(confirmArg);
    const nodes = players.map((player, index) => {
        const selected = player.id === selectedId ? 'selected' : '';
        const nearest = index === getNearestTargetWheelIndex(players.length, rotation) ? 'nearest' : '';
        const avatar = player.gender === 'female' ? '👩' : '👨';
        return `
            <button class="target-wheel-node ${selected} ${nearest}" data-id="${player.id}" data-index="${index}"
                onclick="selectTarget(${player.id}, '${action}')"
                style="transform:${targetWheelNodeStyle(index, players.length, rotation)};">
                <span class="num">${player.id + 1}</span>
                <span class="avatar">${avatar}</span>
                <span class="name">${player.name}</span>
            </button>
        `;
    }).join('');

    return `
        <div class="target-wheel-area">
            <div class="target-wheel-shell" data-action="${action}" data-player-ids="${playerIds}"
                style="--wheel-rotation:${rotation}deg;"
                onpointerdown="targetWheelPointerDown(event, '${action}')"
                onpointermove="targetWheelPointerMove(event, '${action}')"
                onpointerup="targetWheelPointerUp(event)"
                onpointercancel="targetWheelPointerUp(event)">
                <div class="target-wheel-nodes">${nodes}</div>
                <div class="target-wheel-center">
                    <div class="target-wheel-center-content">
                        <div class="target-wheel-label">当前选中</div>
                        <div class="target-wheel-selected-name" data-role="selected-name">${selectedName}</div>
                        <button class="target-wheel-confirm" onclick="confirmTargetWheelSelection('${action}', '${confirmCommand}', ${argText})">${confirmLabel}</button>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function getNearestTargetWheelIndex(total, rotation) {
    let nearestIndex = 0;
    let nearestDistance = Infinity;
    for (let index = 0; index < total; index++) {
        const angle = index * (360 / total) + rotation;
        const distance = circularAngleDistance(angle, -90);
        if (distance < nearestDistance) {
            nearestDistance = distance;
            nearestIndex = index;
        }
    }
    return nearestIndex;
}

function normalizeWheelAngle(angle) {
    return ((angle % 360) + 360) % 360;
}

function circularAngleDistance(a, b) {
    const diff = Math.abs(normalizeWheelAngle(a) - normalizeWheelAngle(b));
    return Math.min(diff, 360 - diff);
}

function angleFromWheelCenter(event, shell) {
    const rect = shell.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.atan2(event.clientY - cy, event.clientX - cx) * 180 / Math.PI;
}

let targetWheelDragState = null;
// 真拖拽结束后抑制紧随其后的一次误触点击（松手位置恰好落在按钮上时）
let targetWheelSuppressClick = false;
// 拖拽判定阈值：指针位移超过该像素数才算拖动，否则视为点击
const TARGET_WHEEL_DRAG_THRESHOLD = 8;

function targetWheelPointerDown(event, action) {
    resetNightRoleTimerForAction(action);
    targetWheelSuppressClick = false;
    const shell = event.currentTarget;
    targetWheelDragState = {
        action,
        pointerId: event.pointerId,
        startAngle: angleFromWheelCenter(event, shell),
        startRotation: getTargetWheelRotation(action),
        startX: event.clientX,
        startY: event.clientY,
        moved: false,
        captured: false
    };
    // 按在按钮（玩家节点/确认键）上时不捕获指针，否则捕获会把 click 事件
    // 重定向到转盘壳，导致按钮的 onclick 永远不触发（鼠标/触控板全挂）
    const onButton = event.target && event.target.closest && event.target.closest('button');
    if (!onButton && shell.setPointerCapture) {
        shell.setPointerCapture(event.pointerId);
        targetWheelDragState.captured = true;
    }
}

function targetWheelPointerMove(event, action) {
    if (!targetWheelDragState || targetWheelDragState.pointerId !== event.pointerId || targetWheelDragState.action !== action) return;
    if (!targetWheelDragState.moved) {
        const dx = event.clientX - targetWheelDragState.startX;
        const dy = event.clientY - targetWheelDragState.startY;
        if (dx * dx + dy * dy < TARGET_WHEEL_DRAG_THRESHOLD * TARGET_WHEEL_DRAG_THRESHOLD) return;
        targetWheelDragState.moved = true;
    }
    resetNightRoleTimerForAction(action);
    const shell = event.currentTarget;
    const rotation = targetWheelDragState.startRotation + angleFromWheelCenter(event, shell) - targetWheelDragState.startAngle;
    setTargetWheelRotation(action, rotation);
    updateTargetWheelTransforms(shell, action);
    selectNearestTargetWheelPlayer(shell, action);
}

function targetWheelPointerUp(event) {
    if (targetWheelDragState && targetWheelDragState.moved) {
        targetWheelSuppressClick = true;
    }
    if (event.currentTarget && event.currentTarget.releasePointerCapture && targetWheelDragState && targetWheelDragState.captured) {
        event.currentTarget.releasePointerCapture(targetWheelDragState.pointerId);
    }
    targetWheelDragState = null;
}

function updateTargetWheelTransforms(shell, action) {
    const rotation = getTargetWheelRotation(action);
    const nodes = shell.querySelectorAll('.target-wheel-node');
    shell.style.setProperty('--wheel-rotation', `${rotation}deg`);
    nodes.forEach(node => {
        const index = Number(node.dataset.index);
        node.style.transform = targetWheelNodeStyle(index, nodes.length, rotation);
    });
}

function selectNearestTargetWheelPlayer(shell, action) {
    const ids = shell.dataset.playerIds.split(',').filter(Boolean).map(Number);
    if (!ids.length) return;
    const index = getNearestTargetWheelIndex(ids.length, getTargetWheelRotation(action));
    selectTarget(ids[index], action);
}

function updateTargetWheelSelection(action) {
    const selectedId = getSelectedTargetForAction(action);
    document.querySelectorAll(`.target-wheel-shell[data-action="${action}"]`).forEach(shell => {
        const selectedPlayer = selectedId === null || selectedId === undefined ? null : getPlayerById(selectedId);
        const name = shell.querySelector('[data-role="selected-name"]');
        if (name) name.textContent = selectedPlayer ? selectedPlayer.name : '请选择';
        shell.querySelectorAll('.target-wheel-node').forEach(node => {
            node.classList.toggle('selected', Number(node.dataset.id) === selectedId);
            node.classList.toggle('nearest', Number(node.dataset.index) === getNearestTargetWheelIndex(shell.querySelectorAll('.target-wheel-node').length, getTargetWheelRotation(action)));
        });
    });
}

function confirmTargetWheelSelection(action, command, arg) {
    if (targetWheelSuppressClick) {
        targetWheelSuppressClick = false;
        return;
    }
    resetNightRoleTimerForAction(action);
    const selectedId = getSelectedTargetForAction(action);
    if (selectedId === null || selectedId === undefined) {
        alert('请先选择目标');
        return;
    }

    if (command === 'confirmNightKill') return confirmNightKill();
    if (command === 'confirmGargoyleKill') return confirmGargoyleKill();
    if (command === 'confirmProphetCheck') return confirmProphetCheck();
    if (command === 'confirmGargoyleCheck') return confirmGargoyleCheck();
    if (command === 'confirmGuardianGuard') return confirmGuardianGuard();
    if (command === 'refreshWitchAction') return showNightWitch(getPlayerById(gameState.currentWitchId));
    if (command === 'confirmHunterShoot') return confirmHunterShoot(arg);
    if (command === 'confirmNightHunterShoot') return confirmNightHunterShoot(arg);
}

function selectTarget(id, action) {
    if (targetWheelSuppressClick) {
        targetWheelSuppressClick = false;
        return;
    }
    resetNightRoleTimerForAction(action);
    gameState.selectedTarget = id;
    // 根据 action 设置对应的目标变量
    if (action === 'nightKill') gameState.nightKillTarget = id;
    if (action === 'gargoyleKill') gameState.gargoyleKillTarget = id;
    if (action === 'prophetCheck') gameState.prophetCheckTarget = id;
    if (action === 'gargoyleCheck') gameState.gargoyleCheckTarget = id;
    if (action === 'witchPoison') {
        gameState.witchPoisonTarget = id;
        gameState.witchPoisonTargets[gameState.currentWitchId] = id;
        if (witchSavePoisonExclusive) delete gameState.witchSaveTargets[gameState.currentWitchId];
    }
    if (action === 'witchSave') {
        gameState.witchSaveTargets[gameState.currentWitchId] = id;
        if (witchSavePoisonExclusive) {
            delete gameState.witchPoisonTargets[gameState.currentWitchId];
            gameState.witchPoisonTarget = null;
        }
    }
    if (action === 'witchSave' || action === 'witchPoison') {
        showNightWitch(getPlayerById(gameState.currentWitchId));
        return;
    }
    if (action === 'guardian') gameState.guardianTarget = id;
    if (action === 'cardActivation') gameState.selectedTarget = id;
    if (action === 'hunterShoot') gameState.selectedTarget = id;
    updateTargetWheelSelection(action);
    // 视觉更新
    document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
    if (id !== null) {
        const el = document.getElementById(`pc-${id}`);
        if (el) el.classList.add('selected');
    }
    saveGameSnapshot();
}

            `,
            timerHtml: nightRoleTimerHtml(),
            targetLabel: text('night.gargoyleCheck.target'),
            wheelHtml: targetWheelHtml(alive, 'gargoyleCheck', text('night.gargoyleCheck.confirm'), 'confirmGargoyleCheck')
        })}
    `;

    document.getElementById('game-bottom-bar').innerHTML = `
        <button class="btn btn-ghost btn-block" onclick="finishNightRoleTimer()">${text('night.timer.skip')}</button>
    `;
    startNightRoleTimer('afterGargoyleCheck');
    setGameResumeView('nightRole', 'gargoyleCheck');
}

function selectGargoyleCheck(id) {
    selectTarget(id, 'gargoyleCheck');
}

function confirmGargoyleCheck() {
    clearNightRoleTimer();
    const gargoyle = getAlivePlayers().find(p => p.roleKey === 'gargoyle');
    if (gameState.gargoyleCheckTarget === null) {
        showNightWolfKill();
        return;
    }

    const target = getPlayerById(gameState.gargoyleCheckTarget);
    gargoyle.gargoyleCheckedIds.add(target.id);

    const frameUpActive = findActiveCardHolder('FRAME_UP', target.id);
    const mistActive = Boolean(findActiveCardHolder('MIST'));

    let resultRole;
    if (mistActive) {
        resultRole = getRandomRole();
        log(`🗿 石像鬼查验 ${target.name} → ${resultRole.name} (迷雾干扰)`, 'wolf');
    } else if (frameUpActive) {
        resultRole = ROLE.VILLAGER;
        log(`🗿 石像鬼查验 ${target.name} → ${resultRole.name} (嫁祸干扰)`, 'wolf');
    } else {
        resultRole = target.role;
        log(`🗿 石像鬼查验 ${target.name} → ${resultRole.name}`, 'wolf');
    }

    gargoyle.gargoyleCheckResults[target.id] = resultRole;
    recordMindRead(target, gargoyle);
    gameState.selectedTarget = null;
    gameState.pendingAction = 'afterGargoyleCheck';

    showCheckResult('石像鬼', gargoyle.name, target.name, resultRole.name, resultRole.emoji);

function recordMindRead(target, checker) {
    const holder = findActiveCardHolder('MIND_READ', target.id);
    if (!holder) return;

    target.mindReadCheckerIds = Array.from(new Set([...(target.mindReadCheckerIds || []), checker.id]));
    target.mindReadInfo = target.mindReadInfo
        ? `${target.mindReadInfo}；${checker.name} 查验了你`
        : `${checker.name} 查验了你`;
    log(`👂 心声聆听触发：主持私下告知 ${target.name}，${checker.name} 查验了他`, 'good');
}

// 心声只交给受保护目标本人；先保存查验者 ID，结果页不公开角色。
function beginMindReadDelivery() {
    if (gameState.mindReadDeliveryDone) return false;
    if (!Array.isArray(gameState.mindReadQueue)) {
        const targets = gameState.players.filter(holder => isCardActive(holder, 'MIND_READ'))
            .map(holder => getPlayerById(holder.cardTargetId)).filter(target => target && target.alive);
        gameState.mindReadQueue = Array.from(new Set(targets.map(target => target.id)));
        gameState.mindReadIndex = 0;
    }
    if (gameState.mindReadIndex >= gameState.mindReadQueue.length) {
        gameState.mindReadDeliveryDone = true;
        return false;
    }
    showMindReadHandoff();
    return true;
}

function showMindReadHandoff() {
    clearNightRoleTimer();
    const target = getPlayerById((gameState.mindReadQueue || [])[gameState.mindReadIndex || 0]);
    if (!target) return;
    document.getElementById('game-phase-text').textContent = text('mindRead.phase');
    document.getElementById('game-content').innerHTML = `
        <div class="info-box" style="text-align:center;">
            <div style="font-size:44px;margin:16px;">🔒</div>
            <h2>${text('mindRead.handoff', { name: target.name })}</h2>
            <div>${text('mindRead.privateNote')}</div>
        </div>
    `;
    document.getElementById('game-bottom-bar').innerHTML = `
        <button class="btn btn-primary btn-block" onclick="showMindReadResult()">${text('mindRead.open', { name: target.name })}</button>
    `;
    setGameResumeView('mindReadHandoff');
}

function showMindReadResult() {
    const target = getPlayerById((gameState.mindReadQueue || [])[gameState.mindReadIndex || 0]);
    if (!target || gameState.mindReadDeliveryDone) return;
    const checkers = (target.mindReadCheckerIds || []).map(getPlayerById).filter(Boolean);
    const result = checkers.length
        ? text('mindRead.checked', { names: checkers.map(checker => checker.name).join('、') })
        : (target.mindReadInfo || text('mindRead.empty'));
    document.getElementById('game-phase-text').textContent = text('mindRead.phase');
    document.getElementById('game-content').innerHTML = `
        <div class="info-box" style="text-align:center;">
            <h2>${text('mindRead.title', { name: target.name })}</h2>
            <div style="font-size:24px;margin:24px 0;">${result}</div>
            <div>${text('mindRead.closeNote')}</div>
        </div>
    `;
    document.getElementById('game-bottom-bar').innerHTML = `
        <button class="btn btn-primary btn-block" onclick="finishMindReadResult()">${text('mindRead.close')}</button>
    `;
    setGameResumeView('mindReadResult');
}

function finishMindReadResult() {
    if (gameState.resumeView?.key !== 'mindReadResult' || gameState.mindReadDeliveryDone) return;
    gameState.mindReadIndex = (gameState.mindReadIndex || 0) + 1;
    if (gameState.mindReadIndex < (gameState.mindReadQueue || []).length) {
        showMindReadHandoff();
        return;
    }
    gameState.mindReadDeliveryDone = true;
    processNightDeaths();
}

// 女巫用药
function getCurrentKnifeDeathIds() {
    const deaths = new Set();
    if (gameState.nightKillTarget !== null) deaths.add(gameState.nightKillTarget);
    if (gameState.gargoyleKillTarget !== null) deaths.add(gameState.gargoyleKillTarget);
    return deaths;
}

function getVisibleDeathIdsForWitch() {
    const deaths = getCurrentKnifeDeathIds();
    // 当前女巫尚未确认的选择不能改变刀口信息；只隐藏前一位女巫已确认的救人。
    Object.entries(gameState.witchSaveTargets).forEach(([witchId, id]) => {
        if (Number(witchId) !== gameState.currentWitchId) deaths.delete(id);
    });
    return deaths;
}

function startWitchPhase() {
    gameState.currentWitchIndex = 0;
    showNextWitch();
}

function getWitchSlots() {
    return gameState.players.filter(p => p.roleKey === 'witch');
}

function showNextWitch() {
    const witches = getWitchSlots();
    if (gameState.currentWitchIndex >= witches.length) {
        showNightGuardian();
        return;
    }

    const witch = witches[gameState.currentWitchIndex];
    gameState.currentWitchId = witch.id;
    if (!restoringGameSnapshot) gameState.selectedTarget = null;

    if (shouldShowNightPrelude('witch')) return;

    if (!witch.alive || witch.skillSealed) {
        showNightRoleWait({
            phaseTitle: text('night.witch.phase'),
            prompt: text('night.witch.prompt'),
            nextAction: 'afterWitch',
            voiceKey: 'witchAction'
        });

    showNightWitch(witch);

function showNightWitch(witch) {
    clearNightRoleTimer();
    const cfg = getConfig(gameState.playerCount);
    const deathIds = Array.from(getVisibleDeathIdsForWitch());
    const deathInfo = deathIds.length > 0
        ? `<div style="font-size:18px;font-weight:700;color:var(--accent-red);margin-bottom:16px;">💀 当前被杀目标：${deathIds.map(id => getPlayerById(id).name).join('、')}</div>`
        : `<div style="font-size:18px;font-weight:700;color:var(--accent-green);margin-bottom:16px;">🌟 当前没有被杀目标</div>`;

    const selectedSave = gameState.witchSaveTargets[witch.id];
    const selectedPoison = gameState.witchPoisonTargets[witch.id];
    const actionSummary = [
        selectedSave !== undefined ? `解药：${getPlayerById(selectedSave).name}` : null,
        selectedPoison !== undefined ? `毒药：${getPlayerById(selectedPoison).name}` : null
    ].filter(Boolean);
    const witchDying = deathIds.includes(witch.id);

    const cureTargets = deathIds
        .map(id => getPlayerById(id))
        .filter(p => p && p.id !== witch.id && witch.cureUsed < witch.maxCure);

        .filter(p => witch.poisonUsed < witch.maxPoison);
    const witchWheelHtml = [
        cureTargets.length > 0 ? `

            ${targetWheelHtml(cureTargets, 'witchSave', '确认解药目标', 'refreshWitchAction')}
        ` : '',
        poisonTargets.length > 0 ? `
            <div class="card-title" style="margin-top:${cureTargets.length > 0 ? '10px' : '0'};">毒药目标</div>
            ${targetWheelHtml(poisonTargets, 'witchPoison', '确认毒药目标', 'refreshWitchAction')}
        ` : ''
    ].join('');

    document.getElementById('game-phase-text').textContent = `第${gameState.dayNumber}夜 · 女巫用药`;
    document.getElementById('game-content').innerHTML = `
        ${targetActionLayoutHtml({
            phaseText: text('night.witch.phase'),
            infoHtml: `
                ${deathInfo}
                <div class="info-box">
                    <div>${text('night.witch.prompt')}</div>
                    <div>${text('night.role.handoff', { name: witch.name })}</div>
                    <div>自救：${!cfg.witchCanSelfSave ? text('night.witch.selfUnavailable') : (witch.selfSaveUsed ? '已用' : '可用')} | 解药：${witch.maxCure - witch.cureUsed} | 毒药：${witch.maxPoison - witch.poisonUsed}</div>
                    ${!cfg.witchCanSelfSave ? '<div style="color:var(--accent-red)">⚠️ 5人局不能自救</div>' : '<div style="color:var(--accent-green)">💊 自救不消耗解药</div>'}
                    ${actionSummary.length > 0 ? `<div style="margin-top:8px;color:var(--accent-yellow);">当前选择：${actionSummary.join('；')}</div>` : ''}
                    ${selectedSave !== undefined ? `<button class="btn btn-ghost btn-block btn-sm" onclick="cancelWitchSelection('save')">${text('night.witch.cancelSave')}</button>` : ''}
                    ${selectedPoison !== undefined ? `<button class="btn btn-ghost btn-block btn-sm" onclick="cancelWitchSelection('poison')">${text('night.witch.cancelPoison')}</button>` : ''}
                </div>
            `,
            timerHtml: nightRoleTimerHtml(),
            targetLabel: '选择用药目标',
            wheelHtml: witchWheelHtml || `<div class="info-box">当前没有可选择的用药目标。</div>`,
            sideExtraHtml: canSelfSave ? `<button class="btn ${selectedSave === witch.id ? 'btn-primary' : 'btn-secondary'} btn-block" onclick="selectWitchSave(${witch.id})">💊 选择自救</button>` : ''
        })}

    document.getElementById('game-bottom-bar').innerHTML = `
        <button class="btn btn-primary btn-block" onclick="confirmWitchAction()">${text('night.witch.confirm', { name: witch.name })}</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="skipWitchAction()">${text('night.witch.skip')}</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="finishNightRoleTimer()">${text('night.timer.skip')}</button>

function selectWitchSave(id) {
    gameState.witchSaveTargets[gameState.currentWitchId] = id;
    if (witchSavePoisonExclusive) {
        delete gameState.witchPoisonTargets[gameState.currentWitchId];

    }
    showNightWitch(getPlayerById(gameState.currentWitchId));
}

function selectWitchPoison(id) {
    gameState.witchPoisonTarget = id;
    gameState.witchPoisonTargets[gameState.currentWitchId] = id;

        delete gameState.witchSaveTargets[gameState.currentWitchId];
    }
    showNightWitch(getPlayerById(gameState.currentWitchId));
}

function cancelWitchSelection(action) {
    const witch = getPlayerById(gameState.currentWitchId);
    if (!witch || !witch.alive || witch.skillSealed) return;
    if (action === 'save') delete gameState.witchSaveTargets[witch.id];
    if (action === 'poison') {
        delete gameState.witchPoisonTargets[witch.id];
        gameState.witchPoisonTarget = null;
    }
    gameState.selectedTarget = null;
    showNightWitch(witch);
}

function confirmWitchAction() {
    const witch = getPlayerById(gameState.currentWitchId);
    const saveTargetId = gameState.witchSaveTargets[witch.id];
    const poisonTargetId = gameState.witchPoisonTargets[witch.id];

    if (witchSavePoisonExclusive && saveTargetId !== undefined && poisonTargetId !== undefined) {
        alert('房规：同一夜不能同时使用解药和毒药，请重新选择（选一样会自动取消另一样）');
        return;
    }
    clearNightRoleTimer();

    if (saveTargetId !== undefined) {
        if (saveTargetId === witch.id) {
            witch.selfSaveUsed = true;
            log(`✨ 女巫 ${witch.name} 选择自救`, 'good');
        } else {
            witch.cureUsed += 1;
            log(`✨ 女巫 ${witch.name} 使用解药救 ${getPlayerById(saveTargetId).name}`, 'good');
        }
    }

    if (poisonTargetId !== undefined) {
        witch.poisonUsed += 1;
        log(`🧪 女巫 ${witch.name} 毒杀 ${getPlayerById(poisonTargetId).name}`, 'good');
    }

    gameState.currentWitchIndex++;
    showNextWitch();
}

function skipWitchAction() {
    clearNightRoleTimer();
    advanceWitchWithoutAction(true);
}

function advanceWitchWithoutAction(shouldLog) {
    const witch = getPlayerById(gameState.currentWitchId);
    if (witch) {
        delete gameState.witchSaveTargets[witch.id];
        delete gameState.witchPoisonTargets[witch.id];
        gameState.witchPoisonTarget = null;
        if (shouldLog && witch.alive && !witch.skillSealed) {
            log(`✨ 女巫 ${witch.name} 选择不使用药`, 'info');
        }
    }
    gameState.currentWitchIndex++;
    gameState.currentWitchId = null;
    showNextWitch();
}
